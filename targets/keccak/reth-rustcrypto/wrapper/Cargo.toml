[package]
name = "reth-keccak-wrapper"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Reth v2.3.0 resolves this exact RustCrypto path through alloy-primitives 1.6.0.
# On RV64, keccak 0.2.0 selects its portable software backend.
sha3 = { version = "=0.11.0", default-features = false }
digest = { version = "=0.11.3", default-features = false }
keccak = { version = "=0.2.0", default-features = false }
block-buffer = { version = "=0.12.0", default-features = false }
crypto-common = { version = "=0.2.1", default-features = false }
hybrid-array = { version = "=0.4.12", default-features = false }
typenum = { version = "=1.20.0", default-features = false }

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
