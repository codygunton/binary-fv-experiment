name: Required Nix checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@v27
      - run: nix flake check --print-build-logs
