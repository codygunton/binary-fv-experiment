name: Required lightweight validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rv64:
    name: RV64 targets and stats
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build RV64 targets and stats
        run: |
          nix build --print-build-logs --no-link \
            .#zesuProductionObject \
            .#zesuRawObject \
            .#zesu-ssz \
            .#stats
      - name: Check flake evaluation
        run: nix flake check --no-build

  lean:
    name: Root Lean library
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build root Lean library
        # Builds the proof plus the production-binary diagnostic modules: BinaryOccurrenceCheck (blob-schedule slice) and
        # ScaleOccurrenceCheck (all 141 function instances) — the native_decide checker/oracle-agreement and the
        # negative (mutation) theorems. The validation-import guard keeps them out of the theorem graph.
        run: |
          nix build --max-jobs 1 --print-build-logs \
            --out-link "$RUNNER_TEMP/binary-fv-lean" .#binary-fv-lean
          cat "$RUNNER_TEMP/binary-fv-lean/profile.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lean profiles
        uses: actions/upload-artifact@v6
        with:
          name: lean-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/binary-fv-lean/profile.md
            ${{ runner.temp }}/binary-fv-lean/root-build.log
            ${{ runner.temp }}/binary-fv-lean/full-build.log
            ${{ runner.temp }}/binary-fv-lean/profiles/merged.json
          retention-days: 30
      - name: Update PR build profile
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROFILE_FILE: ${{ runner.temp }}/binary-fv-lean/profile.md
        shell: bash
        run: |
          marker='<!-- binary-fv-lean-profile -->'
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)"
          if test -n "$comment_id"; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$(<"$PROFILE_FILE")"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(<"$PROFILE_FILE")"
          fi

  production-evidence:
    name: Production-ELF execution checks and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      # PR-fast smoke: the decodeOptionalBlobSchedule vertical slice — capture the present/absent/malformed
      # arms from the UNCHANGED zesu-ssz ELF under pinned qemu+GDB and drift-check the committed observations.
      - name: Check blob-schedule execution slice
        run: nix build --print-build-logs --no-link .#ssz-binary-evidence
      # Required: scale the same machinery to ALL 141 function instances (per-function-instance coverage,
      # explicit gaps) and the STATIC classification of the uncovered function instances; both regenerate
      # from the unchanged ELF
      # and byte-drift-check the committed Lean checks, coverage report, and classification.
      - name: Check all function instances and report coverage
        run: nix build --print-build-logs --no-link .#ssz-scale-evidence

  ssz:
    name: SSZ oracle, core differential, and sink
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Check sink observability
        run: nix build --print-build-logs --no-link .#zesu-sink-observability
      - name: Build the host SSZ value formatter
        run: |
          nix build --print-build-logs \
            --out-link "$RUNNER_TEMP/zesu-ssz-value" \
            .#zesu-value
      - name: Build the Lean oracle and run the strict core differential
        shell: bash
        run: |
          nix shell --inputs-from . \
            nixpkgs#elan \
            nixpkgs#uv \
            nixpkgs#jq \
            nixpkgs#pkg-config \
            nixpkgs#openssl.dev \
            nixpkgs#gcc \
            -c bash -euo pipefail <<'EOF'
              export ELAN_HOME="$RUNNER_TEMP/elan"
              export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
              elan toolchain install "$(tr -d "\\r\\n" < tools/ssz-oracle/lean-toolchain)"

              openssl_dev="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#openssl.dev)"
              export PKG_CONFIG_PATH="$openssl_dev/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
              export LD_LIBRARY_PATH="$openssl_dev/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

              cd tools/ssz-oracle
              lake update
              git diff --exit-code -- lake-manifest.json
              lake build repl
              lake build ssz_oracle ssz_oracle_test
              lake exe ssz_oracle_test
              cd "$GITHUB_WORKSPACE"

              reference_source="$(nix flake archive --json | jq -r ".inputs.executionSpecs.path")"
              test "$reference_source" != null
              test -d "$reference_source"
              reference_root="$RUNNER_TEMP/execution-specs"
              cp -a "$reference_source" "$reference_root"
              chmod -R u+w "$reference_root"
              (
                cd "$reference_root"
                uv sync --locked --no-dev
              )
              reference_python="$reference_root/.venv/bin/python"
              test -x "$reference_python"

              "$reference_python" -B verification-target/zesu/tests/ssz_differential_audit.py \
                --reference-python "$reference_python" \
                --zesu-value-binary "$RUNNER_TEMP/zesu-ssz-value/bin/zesu-ssz-value" \
                --lean-binary tools/ssz-oracle/.lake/build/bin/ssz_oracle
          EOF
