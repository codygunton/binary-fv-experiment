name: Required Nix checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: cachix/install-nix-action@v27
      - name: Run required checks with bounded parallelism
        run: nix flake check --print-build-logs --max-jobs 2 --cores 0
