name: Required lightweight validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rv64:
    name: RV64 targets and stats
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build RV64 targets and stats
        run: |
          nix build --print-build-logs --no-link \
            .#reth-keccak \
            .#zesuProductionObject \
            .#zesuRawObject \
            .#zesu-ssz \
            .#stats
      - name: Check flake evaluation
        run: nix flake check --no-build

  lean:
    name: Root Lean library
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build root Lean library
        # Builds the proof + the Row C diagnostic lane: BinaryOccurrenceCheck (blob-schedule slice) and
        # ScaleOccurrenceCheck (all 141 occurrences) — the native_decide checker/oracle-agreement and the
        # negative (mutation) theorems. The validation-import guard keeps them out of the theorem graph.
        run: nix build --max-jobs 1 --print-build-logs --no-link .#binary-fv-lean

  row-c:
    name: Row C production-ELF validation (evidence, coverage, static classification)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      # PR-fast smoke: the decodeOptionalBlobSchedule vertical slice — capture the present/absent/malformed
      # arms from the UNCHANGED zesu-ssz ELF under pinned qemu+GDB and drift-check the committed evidence.
      - name: Row C spike (blob-schedule vertical slice, PR-fast)
        run: nix build --print-build-logs --no-link .#ssz-binary-evidence
      # Required: scale the same machinery to ALL 141 occurrences (per-occurrence coverage, explicit gaps)
      # and the STATIC classification of the uncovered occurrences; both regenerate from the unchanged ELF
      # and byte-drift-check the committed Lean evidence, coverage report, and classification.
      - name: Row C scaled coverage + static uncovered classification (required)
        run: nix build --print-build-logs --no-link .#ssz-scale-evidence

  ssz:
    name: SSZ bridge, core differential, and sink
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Check sink observability
        run: nix build --print-build-logs --no-link .#zesu-sink-observability
      - name: Build the host SSZ value formatter
        run: |
          nix build --print-build-logs \
            --out-link "$RUNNER_TEMP/zesu-ssz-value" \
            .#zesu-value
      - name: Build the Lean bridge and run the strict core differential
        shell: bash
        run: |
          nix shell --inputs-from . \
            nixpkgs#elan \
            nixpkgs#uv \
            nixpkgs#jq \
            nixpkgs#pkg-config \
            nixpkgs#openssl.dev \
            nixpkgs#gcc \
            -c bash -euo pipefail <<'EOF'
              export ELAN_HOME="$RUNNER_TEMP/elan"
              export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
              elan toolchain install "$(tr -d "\\r\\n" < targets/ssz/zesu/spec/lean-toolchain)"

              openssl_dev="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#openssl.dev)"
              export PKG_CONFIG_PATH="$openssl_dev/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
              export LD_LIBRARY_PATH="$openssl_dev/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

              cd targets/ssz/zesu/spec
              lake update
              git diff --exit-code -- lake-manifest.json
              lake build repl
              lake build ssz_bridge ssz_bridge_test
              lake exe ssz_bridge_test
              cd "$GITHUB_WORKSPACE"

              reference_source="$(nix flake archive --json | jq -r ".inputs.executionSpecs.path")"
              test "$reference_source" != null
              test -d "$reference_source"
              reference_root="$RUNNER_TEMP/execution-specs"
              cp -a "$reference_source" "$reference_root"
              chmod -R u+w "$reference_root"
              (
                cd "$reference_root"
                uv sync --locked --no-dev
              )
              reference_python="$reference_root/.venv/bin/python"
              test -x "$reference_python"

              "$reference_python" -B targets/ssz/zesu/tests/ssz_differential_audit.py \
                --reference-python "$reference_python" \
                --zesu-value-binary "$RUNNER_TEMP/zesu-ssz-value/bin/zesu-ssz-value" \
                --lean-binary targets/ssz/zesu/spec/.lake/build/bin/ssz_bridge
          EOF
