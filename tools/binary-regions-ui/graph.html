<!--
  The graph viewer of plan S9. `python3 -m zmap site` (or `make -C exec-spike/tools/zmap map`)
  copies this page to exec-spike/map/site/index.html beside vendor/ (d3.min.js, pixi.min.js),
  data/index.js (window.ZMAP_INDEX), data/fn/<id>.js (ZMAP_FN(id, {...}): what is drawn) and
  data/fn/<id>.detail.js (ZMAP_FN_DETAIL(id, {...}): disassembly, source, card), both loaded on
  demand by a script tag. Opened as tools/binary-regions-ui/graph.html (the flamegraph's link) it
  reads that site's data. Works from file:// and from the server (port 36405, exec-spike/map/site).
  Every layout coordinate comes from tools/zmap/layout.py; this page only draws.
  Rendering (S9.3): one PixiJS (WebGL) stage for both levels. Display objects are built once per
  view; clicks, hovers, layer and badge changes only set tint, alpha and visibility; pan and zoom
  only set the stage transform. Hit-testing goes through d3 quadtrees.
-->

<script>
if (!window.ZMAP_INDEX) {
  window.ZMAP_DATA = '../../exec-spike/map/site/data/';

<script>
'use strict';
const IX = window.ZMAP_INDEX;
if (!IX || !window.d3 || !window.PIXI) {
  document.body.innerHTML = '<div class="err">No data. Run `python3 -m zmap site --out exec-spike/map/site` ' +
    '(or `make -C exec-spike/tools/zmap map`) and open exec-spike/map/site/index.html.</div>';
  throw new Error('no ZMAP_INDEX');
}

// ------------------------------------------------------------------ data
const FN = new Map(IX.functions.map(f => [f.id, f]));
const LAY = IX.layout;
const ITEM = new Map(LAY.items.map(it => [it.id, it]));
const FPOS = LAY.functions;
const hex = n => '0x' + Number(n).toString(16);
const callees = new Map(), callers = new Map();
for (const f of IX.functions) { callees.set(f.id, new Set()); callers.set(f.id, new Set()); }
for (const e of IX.edges) { callees.get(e.from).add(e.to); callers.get(e.to).add(e.from); }
function closure(start, adj) {
  const seen = new Set(), st = [start];
  while (st.length) for (const m of adj.get(st.pop()) || []) if (!seen.has(m)) { seen.add(m); st.push(m); }
  seen.delete(start); return seen;
}
const needs = new Map(), unblocks = new Map();
const needsOf = id => { if (!needs.has(id)) needs.set(id, closure(id, callees)); return needs.get(id); };
const unblocksOf = id => { if (!unblocks.has(id)) unblocks.set(id, closure(id, callers)); return unblocks.get(id); };
// Meaning complete: the function and every callee below it are spec-sail or model.
const MEANINGFUL = new Set(['spec-sail', 'model']);
const meaningComplete = f => MEANINGFUL.has(f.meaning) && [...needsOf(f.id)].every(c => MEANINGFUL.has(FN.get(c).meaning));

// ------------------------------------------------------------------ layers and badges
const C = {
  'closed+compliance': '#2ea043', 'closed+sail': '#56d364', 'closed': '#a5f0b4',
  'closed-on-assumptions': '#9be9a8', 'conditional': '#e3b341', 'in-proof': '#d29922',
  'contract-draft': '#bc8cff', 'service': '#8b949e', 'assumed': '#a371f7', 'blocked': '#f85149', 'ready': '#58a6ff',
  'waiting': '#6e7681', 'out': '#30363d',
};
const LEAF_C = { auto: '#56d364', manual: '#58a6ff', open: '#f85149' };
const LAYERS = {
  proof: { label: 'Proof', values: Object.keys(C).filter(k => k !== 'out'), color: v => C[v] || '#6e7681',
           value: f => f.state },
  meaning: { label: 'Meaning', values: ['spec-sail', 'model', 'machine-only', 'none'],
             color: v => ({ 'spec-sail': '#2ea043', model: '#58a6ff', 'machine-only': '#e3b341', none: '#3b434e' })[v],
             value: f => f.meaning || 'none' },
  trust: { label: 'Trust', values: ['service', 'assumed', 'rests on trusted', 'rests on nothing trusted'],
           color: v => ({ service: '#a371f7', assumed: '#f85149', 'rests on trusted': '#d9a0a6', 'rests on nothing trusted': '#3b434e' })[v],
           value: f => f.service ? 'service' : f.assumed ? 'assumed' : (f.rests_on && f.rests_on.length ? 'rests on trusted' : 'rests on nothing trusted') },
  contract: { label: 'Contract', values: ['reviewed', 'transcribed', 'draft', 'none'],
              color: v => ({ reviewed: '#2ea043', transcribed: '#e3b341', draft: '#f0883e', none: '#3b434e' })[v],
              value: f => !f.contract ? 'none' : (f.contract.review === 'reviewed' ? 'reviewed' : (f.contract.contract || 'draft')) },
  // S9.2: dollars from the session logs (S10.1), the forecast p50 (S10.4), automatic share.
  // Values run from "no data" through best to worst; a source function takes the latest value
  // over the binary functions it lives in.
  cost: { label: 'Cost spent', values: ['no data', '$0', '<$1', '$1–10', '$10–100', '≥$100'],
          color: v => ({ 'no data': '#2a313c', '$0': '#3b434e', '<$1': '#ffe8cc', '$1–10': '#ffa94d', '$10–100': '#f76707', '≥$100': '#c92a2a' })[v],
          value: f => !f.cost ? 'no data' : dollarBand(+f.cost.usd || 0) },
  forecast: { label: 'Forecast', values: ['none (closed or no sample)', '$0', '<$1', '$1–10', '$10–100', '≥$100'],
              color: v => ({ 'none (closed or no sample)': '#2a313c', '$0': '#3b434e', '<$1': '#d0ebff', '$1–10': '#74c0fc', '$10–100': '#1c7ed6', '≥$100': '#a61e4d' })[v],
              value: f => f.forecast == null ? 'none (closed or no sample)' : dollarBand(+(typeof f.forecast === 'object' ? f.forecast.p50 : f.forecast) || 0) },
  automation: { label: 'Automation', values: ['no leaves', '100%', '50–99%', '1–49%', '0%'],
                color: v => ({ 'no leaves': '#2a313c', '100%': '#2ea043', '50–99%': '#8ddb8c', '1–49%': '#e3b341', '0%': '#f85149' })[v],
                value: f => f.auto_share == null ? 'no leaves' : f.auto_share >= 1 ? '100%' : f.auto_share >= 0.5 ? '50–99%' : f.auto_share > 0 ? '1–49%' : '0%' },
  class: { label: 'Class', values: null, color: null, value: null },
};
const CLASS_DIMS = {
  size: { label: 'size band', values: ['size:<=150', 'size:151-600', 'size:601-3000', 'size:>3000'],
          colors: ['#a5d6ff', '#58a6ff', '#1f6feb', '#0d419d'] },
  loops: { label: 'loop band', values: ['loops:0', 'loops:1-3', 'loops:>3'], colors: ['#3b434e', '#e3b341', '#f0883e'] },
};
for (const k of ['recursive', 'irreducible', 'jump-table', 'indirect-call', 'accelerator', 'ecall', 'generic-copy'])
  CLASS_DIMS[k] = { label: k, values: [k, 'not ' + k], colors: ['#f778ba', '#3b434e'] };
function classValue(f, dim) {
  const d = CLASS_DIMS[dim], cs = f.classes || [];
  if (dim === 'size' || dim === 'loops') return cs.find(c => d.values.includes(c)) || d.values[0];
  return cs.includes(dim) ? dim : 'not ' + dim;
}
const BADGES = {
  loops: { label: 'loops', color: '#e3b341', text: f => f.n_loops ? `L${f.n_loops}·d${f.max_loop_depth}` : null },
  joins: { label: 'joins', color: '#79c0ff', text: f => f.n_joins ? `J${f.n_joins}·${f.max_fanin}` : null },
  tables: { label: 'jump tables', color: '#d2a8ff', text: f => f.n_tables ? `T${f.n_tables}` : null },
  indirect: { label: 'indirect calls', color: '#f0883e', text: f => f.n_indirect ? `I${f.n_indirect}` : null },
  recursion: { label: 'recursion', color: '#f778ba', text: f => f.recursive ? 'rec' : null },
  irreducible: { label: 'irreducible', color: '#ff7b72', text: f => f.irreducible ? 'irr' : null },
  accel: { label: 'accelerators', color: '#a5d6ff', text: f => { const n = Object.values(f.csr || {}).reduce((a, b) => a + b, 0); return n ? `csr${Object.keys(f.csr).length}·${n}` : null; } },
  forms: { label: 'unsupported forms', color: '#ffa198', text: f => { const n = Object.keys(f.forms_unsupported || {}).length; return n ? `U${n}` : null; } },
  ecall: { label: 'ecall', color: '#56d4dd', text: f => f.ecall ? `ecall${f.ecall}` : null },
  open: { label: 'open items', color: '#f85149', text: f => f.open_items ? `open${f.open_items}` : null },
};
const RES_C = { exact: '#56d364', precondition: '#58a6ff', 'table-heuristic': '#f0883e', unknown: '#f85149', unresolved: '#f85149', direct: '#4c5564' };
function dollarBand(u) { return u === 0 ? '$0' : u < 1 ? '<$1' : u < 10 ? '$1–10' : u < 100 ? '$10–100' : '≥$100'; }
// Time slider (S9.2): Proof and Meaning as of a commit of map/history.jsonl.
const HIST = IX.history || [];
function histValue(f, layer) {
  const row = HIST[S.hist], c = row && row.fns[f.id];
  if (!c) return layer === 'proof' ? 'out' : 'none';
  return layer === 'proof' ? row.state_codes[c[0]] : row.meaning_codes[c[1]];
}
// Codes of the flat arrays in data/fn/<id>.js (site.py BLOCK_KINDS, EXITS, EDGE_KINDS, CUT_WHY, CALL_KINDS).
const EXITS = [null, 'call', 'tail', 'table', 'ret'];
const BLOCK_KINDS = ['plain', 'join', 'loop_head'];
const EDGE_KINDS = ['fall', 'taken', 'jump', 'back', 'table'];
const CUT_WHY = ['entry', 'loop', 'ret', 'join', 'cycle'];
const CALL_KINDS = ['direct', 'indirect', 'tail'];

// ------------------------------------------------------------------ state and URL hash
const SRC = window.ZMAP_SRC || null;    // source view data (data/src/index.js); absent: no source view
const S = { view: SRC ? 'source' : 'program', fn: null, sel: null, layer: 'proof', cls: 'size', size: 'cuts',
            badges: new Set(), cut: null, block: null, unstack: new Set(), filter: null, drawer: null, hover: null,
            src: null, file: null, srcOpen: new Set(), hl: null, hist: null };
// Navigation history. Every navigation (centring a source function, opening a control-flow view,
// selecting a block, changing the source file, switching view) pushes a browser history entry
// carrying the whole view in the hash; other changes replace the current entry. `popstate`
// restores a view without a reload. NAV mirrors the entries for the in-page Back/Forward buttons
// and the list of visited places.
let navKey = null;
const NAV = { list: [], i: -1 };
const navKeyOf = () => `${S.view}|${S.src}|${S.fn}|${S.block}|${S.file}`;
function navLabel() {
  if (S.view === 'program') return 'Program';
  if (S.view === 'fn') return (FN.get(S.fn) || { name: S.fn }).name + (S.block != null ? ' @' + hex(S.block) : '');
  return S.src != null && SF[S.src] ? SF[S.src].name : 'source';
}
function writeHash(replace = false) {
  const p = new URLSearchParams();
  if (S.view === 'fn' && S.fn) p.set('fn', S.fn);
  if (S.view === 'program') p.set('view', 'program');
  if (S.view === 'source' && S.src != null) p.set('src', srcKey(S.src));
  if (S.view === 'fn' && S.hl != null) p.set('hl', srcKey(S.hl));
  if (S.view !== 'program' && S.file != null) p.set('file', SRC_FILES[S.file].short);
  if (S.sel && S.view !== 'source') p.set('sel', S.sel);
  p.set('layer', S.layer);
  if (S.layer === 'class') p.set('cls', S.cls);
  if (S.size !== 'cuts') p.set('size', S.size);
  if (S.badges.size) p.set('badges', [...S.badges].join(','));
  if (S.cut != null) p.set('cut', hex(S.cut));
  if (S.block != null) p.set('block', hex(S.block));
  if (S.unstack.size) p.set('unstack', [...S.unstack].join('|'));
  if (S.srcOpen.size && S.view === 'source') p.set('open', [...S.srcOpen].join(','));
  if (S.filter) p.set('filter', S.filter);
  if (S.drawer) p.set('drawer', S.drawer);
  if (S.hist != null) p.set('hist', String(S.hist));
  const h = '#' + p.toString().replace(/%2C/g, ',').replace(/%3A/g, ':').replace(/%7C/g, '|').replace(/%2F/g, '/');
  const key = navKeyOf(), entry = { h, label: navLabel() };
  if (NAV.i < 0) { NAV.list = [entry]; NAV.i = 0; history.replaceState({ i: 0 }, '', h); }
  // Filling in the file of a view that had none yet (first render) is not a navigation.
  else if (!replace && navKey != null && key !== navKey && !(navKey.endsWith('|null') && navKey.slice(0, -5) === key.slice(0, key.lastIndexOf('|')))) {
    NAV.list = NAV.list.slice(0, NAV.i + 1); NAV.list.push(entry); NAV.i++;
    history.pushState({ i: NAV.i }, '', h);
  } else { NAV.list[NAV.i] = entry; if (location.hash !== h) history.replaceState({ i: NAV.i }, '', h); }
  navKey = key;
  renderNav();
}
function renderNav() {
  const el = document.getElementById('nav'); if (!el) return;

      const q = rows[+tr.dataset.i];
      const ids = q.type === 'blocker' ? q.functions.filter(id => FN.has(id)) : [q.fn];
      tr.onmouseenter = () => { S.hover = ids[0]; if (!app) return; if (S.view === 'program') applyProgramStyle('ids:' + ids.join(',')); else if (S.view === 'source') applySrcStyle('ids:' + ids.join(',')); };
      tr.onmouseleave = () => { S.hover = null; if (!app) return; if (S.view === 'program') applyProgramStyle(); else if (S.view === 'source') applySrcStyle(); };
      tr.onclick = () => {
        if (q.type === 'blocker') { S.filter = 'ids:' + ids.join(','); S.sel = null; if (S.view !== 'program') openProgram(); else render(); return; }
        if (q.cut != null) { S.cut = q.cut; S.block = null; S.sel = q.fn; if (S.fn !== q.fn) fnT.delete(q.fn); S.view = 'fn'; S.fn = q.fn; render(); return; }
        if (S.view === 'source') { const sf = SF.find(f => f.loc.some(L => L[0] === q.fn && L[2])); if (sf) { centreSrc(sf.id); return; } }
        selectFn(q.fn, true);
      };
    }
  } else if (S.drawer === 'metrics') {
    body.innerHTML = IX.metrics ? metricsHtml(IX.metrics) : '<p class="muted">Metrics: no data (map/metrics.json).</p>';
  } else {
    body.innerHTML = HIST.length ? trendHtml() : '<p class="muted">Trend: no data (map/history.jsonl).</p>';
    for (const tr of body.querySelectorAll('tr.row[data-h]')) tr.onclick = () => { const v = +tr.dataset.h; S.hist = v >= HIST.length - 1 ? null : v; render(); };
  }
}
// Metrics drawer: every group of metrics.json; {columns, rows} as tables, scalars as key/value.
function metricsHtml(m) {
  const cell = v => esc(typeof v === 'number' ? (Number.isInteger(v) ? v : +v.toFixed(3)) : Array.isArray(v) ? v.join(', ') : v == null ? '—' : typeof v === 'object' ? JSON.stringify(v) : v);
  const part = (o, depth) => {
    if (o && Array.isArray(o.columns) && Array.isArray(o.rows))
      return `<table><tr>${o.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${o.rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</table>`;
    if (o && typeof o === 'object' && !Array.isArray(o)) {
      const scal = Object.entries(o).filter(([k, v]) => v == null || typeof v !== 'object' || Array.isArray(v));
      const sub = Object.entries(o).filter(([k, v]) => v && typeof v === 'object' && !Array.isArray(v));
      return (scal.length ? `<table>${scal.map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${cell(v)}</td></tr>`).join('')}</table>` : '') +
        sub.map(([k, v]) => `<div style="margin:4px 0 0 ${depth * 10}px"><b>${esc(k)}</b>${part(v, depth + 1)}</div>`).join('');
    }
    return cell(o);
  };
  return `<div class="muted">generated ${esc(m.generated || '')}</div>` + Object.entries(m).filter(([k]) => !['schema', 'generated'].includes(k))
    .map(([k, v]) => `<h4 style="margin:8px 0 2px">${esc(k)}</h4>${part(v, 0)}`).join('');
}
// Trend drawer: one row per commit of history.jsonl; clicking a row moves the time slider there.
function trendHtml() {
  const pct = v => v == null ? '—' : (100 * v).toFixed(1) + '%';
  return `<table><tr><th>when</th><th>commit</th><th>cut points closed</th><th>closed on assumptions</th><th>total</th><th>automatic share</th><th>$ spent</th></tr>` +
    HIST.map((r, i) => { const c = r.coverage || {}; return `<tr class="row" data-h="${i}"${i === S.hist ? ' style="background:#2a3442"' : ''}><td>${esc((r.ts || '').replace('T', ' ').slice(0, 16))}</td><td>${esc((r.commit || '').slice(0, 8))}</td><td>${c.cut_points_closed ?? '—'}</td><td>${c.cut_points_closed_on_assumptions ?? '—'}</td><td>${c.cut_points_total ?? '—'}</td><td>${pct(r.auto_share)}</td><td>${r.usd != null ? '$' + (+r.usd).toFixed(2) : '—'}</td></tr>`; }).reverse().join('') + '</table>';
}
// Cost multiplier of a badge driver (S9 "cost drivers"): dollars per cut point in closed functions
// with the driver divided by dollars per cut point in closed functions without it.
function costMultiplier(b) {
  const closed = IX.functions.filter(f => ['closed', 'closed+sail', 'closed+compliance', 'closed-on-assumptions'].includes(f.state) && f.cost && f.n_cuts);
  const rate = fs => { const cuts = fs.reduce((a, f) => a + f.n_cuts, 0), usd = fs.reduce((a, f) => a + (+f.cost.usd || 0), 0); return cuts && usd ? usd / cuts : null; };
  const w = rate(closed.filter(f => BADGES[b].text(f))), wo = rate(closed.filter(f => !BADGES[b].text(f)));
  return w != null && wo ? (w / wo).toFixed(2) : '— (not measured)';
}

// ------------------------------------------------------------------ start
window.ZV = { S, render, openFn, openProgram, selectFn, setTransform, currentT, FNDATA, FS, P, NB, SF, SRC_KEY, centreSrc, openFnHl, openSrcFile, get app() { return app; } };
for (const b of document.querySelectorAll('#viewsw button')) b.onclick = () => {
  if (b.dataset.view === 'program') openProgram();
  else if (SRC) { S.view = 'source'; S.fn = null; S.block = null; S.cut = null; if (S.src == null) S.src = SRC.default; render(); }
};
window.addEventListener('popstate', ev => {
  if (ev.state && Number.isInteger(ev.state.i)) NAV.i = Math.min(ev.state.i, NAV.list.length - 1);
  readHash(); navKey = navKeyOf(); render();
});
readHash();
initRenderer().then(ok => {
  if (ok) { buildProgram(); buildMini(); wireEvents(); progT = null; }
  render();
}, err => {
  stageEl.insertAdjacentHTML('afterbegin', `<div id="nowebgl">This browser has no WebGL context; the graph cannot be drawn. (${esc(err.message)})</div>`);
  render();
});
</script>
