<!doctype html>
<meta charset="utf-8">
<title>Zesu proof graph (zmap)</title>
<link rel="icon" href="data:,">
<!--
  The graph viewer of plan S9. `python3 -m zmap site` (or `make -C exec-spike/tools/zmap map`)
  copies this page to exec-spike/map/site/index.html beside vendor/ (d3.min.js, pixi.min.js),
  data/index.js (window.ZMAP_INDEX), data/fn/<id>.js (ZMAP_FN(id, {...}): what is drawn) and
  data/fn/<id>.detail.js (ZMAP_FN_DETAIL(id, {...}): disassembly, source, card), both loaded on
  demand by a script tag. Opened as tools/binary-regions-ui/graph.html (the flamegraph's link) it
  reads that site's data. Works from file:// and from the server (port 36405, exec-spike/map/site).
  Every layout coordinate comes from tools/zmap/layout.py; this page only draws.
  Rendering (S9.3): one PixiJS (WebGL) stage for both levels. Display objects are built once per
  view; clicks, hovers, layer and badge changes only set tint, alpha and visibility; pan and zoom
  only set the stage transform. Hit-testing goes through d3 quadtrees.
-->
<style>
 :root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--fg:#dfe4ec;--dim:#8a93a3;--hi:#ffd54a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;
      font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{height:40px;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;white-space:nowrap}
 h1{font-size:13px;margin:0 6px 0 0;font-weight:600}
 button,select,input{background:#1e242e;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font:inherit}
 button{cursor:pointer} button.on{background:#33404f;border-color:#5a6b80}
 a{color:#8ab4f8}
 .muted{color:var(--dim)}
 #badgebox{position:relative}
 #badgemenu{display:none;position:absolute;top:28px;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:5px}
 #badgemenu label{display:block;cursor:pointer}
 #badgebox.open #badgemenu{display:block}
 main{position:absolute;top:40px;left:0;right:0;bottom:var(--drawer,30px);display:grid;grid-template-columns:minmax(0,1fr) 540px}
 #stage{position:relative;overflow:hidden;min-width:0}
 #stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
 #nowebgl{padding:30px;color:#f3aaaa}
 #panel{border-left:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel)}
 #panel pre{white-space:pre-wrap;margin:6px 0;font:inherit;color:#c9d1d9}
 #panel h2{font-size:13px;margin:0 0 4px}
 #panel h3{font-size:12px;margin:10px 0 3px;color:#aab4c3}
 #panel table{border-collapse:collapse;width:100%}
 #panel td{padding:1px 6px 1px 0;vertical-align:top}
 #panel .k{color:var(--dim);white-space:nowrap}
 .dis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px}
 .dis div{background:#11151b;border:1px solid var(--line);padding:4px 6px;overflow:auto;max-height:420px;white-space:pre;font-size:11px}
 .pill{display:inline-block;padding:0 5px;border-radius:8px;margin:0 3px 2px 0;font-size:11px;color:#111}
 .rowlink{cursor:pointer;text-decoration:underline dotted}
 #legend{position:absolute;left:8px;bottom:8px;background:rgba(22,26,33,.94);border:1px solid var(--line);border-radius:5px;padding:6px 9px;max-width:460px;z-index:5}
 #legend .item{display:inline-flex;align-items:center;gap:4px;margin:0 9px 2px 0;cursor:pointer}
 #legend .item.off{opacity:.35}
 #legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
 #legend .t{color:var(--dim);margin-top:3px}
 #crumb{position:absolute;left:8px;top:8px;z-index:5;background:rgba(22,26,33,.94);border:1px solid var(--line);border-radius:5px;padding:3px 8px;display:none}
 #tip{position:fixed;pointer-events:none;z-index:30;background:#1e242e;border:1px solid #3a4452;border-radius:4px;padding:4px 7px;display:none;max-width:420px;white-space:pre-wrap}
 footer{position:absolute;left:0;right:0;bottom:0;height:var(--drawer,30px);border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
 #tabs{height:29px;display:flex;gap:6px;align-items:center;padding:0 8px;flex:none}
 #drawerbody{overflow:auto;flex:1;padding:0 8px}
 #drawerbody table{border-collapse:collapse;width:100%}
 #drawerbody td,#drawerbody th{border-bottom:1px solid var(--line);padding:2px 6px;text-align:left;white-space:nowrap}
 #drawerbody tr.row{cursor:pointer} #drawerbody tr.row:hover{background:#1d232d}
 .err{padding:30px;color:#f3aaaa;white-space:pre-wrap}
</style>
<header>
  <h1>Zesu proof graph</h1>
  <input id="search" list="names" placeholder="search name, address, id" size="30">
  <datalist id="names"></datalist>
  <label class="muted">layer <select id="layer"></select></label>
  <select id="cls" title="class dimension"></select>
  <label class="muted">size <select id="size"></select></label>
  <span id="badgebox"><button id="badgebtn">badges ▾</button><div id="badgemenu"></div></span>
  <button id="clearfilter" title="clear filter">clear filter</button>
  <span id="counts" class="muted"></span>
</header>
<main>
  <div id="stage">
    <div id="crumb"></div>
    <div id="legend"></div>
  </div>
  <aside id="panel"></aside>
</main>
<footer>
  <div id="tabs">
    <button data-tab="queue">Queue</button>
    <button data-tab="metrics">Metrics</button>
    <button data-tab="trend">Trend</button>
    <span class="muted" id="drawerhint">drawer closed; click a tab</span>
  </div>
  <div id="drawerbody"></div>
</footer>
<div id="tip"></div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script>
window.ZMAP_DATA = 'data/';
document.write('<script src="data/index.js"><\/script>');
</script>
<script>
if (!window.ZMAP_INDEX) {
  window.ZMAP_DATA = '../../exec-spike/map/site/data/';
  document.write('<script src="' + window.ZMAP_DATA + 'index.js"><\/script>');
}
</script>
<script>
'use strict';
const IX = window.ZMAP_INDEX;
if (!IX || !window.d3 || !window.PIXI) {
  document.body.innerHTML = '<div class="err">No data. Run `python3 -m zmap site --out exec-spike/map/site` ' +
    '(or `make -C exec-spike/tools/zmap map`) and open exec-spike/map/site/index.html.</div>';
  throw new Error('no ZMAP_INDEX');
}

// ------------------------------------------------------------------ data
const FN = new Map(IX.functions.map(f => [f.id, f]));
const LAY = IX.layout;
const ITEM = new Map(LAY.items.map(it => [it.id, it]));
const FPOS = LAY.functions;
const hex = n => '0x' + Number(n).toString(16);
const callees = new Map(), callers = new Map();
for (const f of IX.functions) { callees.set(f.id, new Set()); callers.set(f.id, new Set()); }
for (const e of IX.edges) { callees.get(e.from).add(e.to); callers.get(e.to).add(e.from); }
function closure(start, adj) {
  const seen = new Set(), st = [start];
  while (st.length) for (const m of adj.get(st.pop()) || []) if (!seen.has(m)) { seen.add(m); st.push(m); }
  seen.delete(start); return seen;
}
const needs = new Map(), unblocks = new Map();
const needsOf = id => { if (!needs.has(id)) needs.set(id, closure(id, callees)); return needs.get(id); };
const unblocksOf = id => { if (!unblocks.has(id)) unblocks.set(id, closure(id, callers)); return unblocks.get(id); };
// Meaning complete: the function and every callee below it are spec-sail or model.
const MEANINGFUL = new Set(['spec-sail', 'model']);
const meaningComplete = f => MEANINGFUL.has(f.meaning) && [...needsOf(f.id)].every(c => MEANINGFUL.has(FN.get(c).meaning));

// ------------------------------------------------------------------ layers and badges
const C = {
  'closed+compliance': '#2ea043', 'closed+sail': '#56d364', 'closed': '#a5f0b4',
  'closed-on-assumptions': '#9be9a8', 'conditional': '#e3b341', 'in-proof': '#d29922',
  'contract-draft': '#bc8cff', 'assumed': '#a371f7', 'blocked': '#f85149', 'ready': '#58a6ff',
  'waiting': '#6e7681', 'out': '#30363d',
};
const LEAF_C = { auto: '#56d364', manual: '#58a6ff', open: '#f85149' };
const LAYERS = {
  proof: { label: 'Proof', values: Object.keys(C).filter(k => k !== 'out'), color: v => C[v] || '#6e7681',
           value: f => f.state },
  meaning: { label: 'Meaning', values: ['spec-sail', 'model', 'machine-only', 'none'],
             color: v => ({ 'spec-sail': '#2ea043', model: '#58a6ff', 'machine-only': '#e3b341', none: '#3b434e' })[v],
             value: f => f.meaning || 'none' },
  trust: { label: 'Trust', values: ['service', 'assumed', 'rests on trusted', 'rests on nothing trusted'],
           color: v => ({ service: '#a371f7', assumed: '#f85149', 'rests on trusted': '#d9a0a6', 'rests on nothing trusted': '#3b434e' })[v],
           value: f => f.service ? 'service' : f.assumed ? 'assumed' : (f.rests_on && f.rests_on.length ? 'rests on trusted' : 'rests on nothing trusted') },
  contract: { label: 'Contract', values: ['reviewed', 'transcribed', 'draft', 'none'],
              color: v => ({ reviewed: '#2ea043', transcribed: '#e3b341', draft: '#f0883e', none: '#3b434e' })[v],
              value: f => !f.contract ? 'none' : (f.contract.review === 'reviewed' ? 'reviewed' : (f.contract.contract || 'draft')) },
  class: { label: 'Class', values: null, color: null, value: null },
};
const CLASS_DIMS = {
  size: { label: 'size band', values: ['size:<=150', 'size:151-600', 'size:601-3000', 'size:>3000'],
          colors: ['#a5d6ff', '#58a6ff', '#1f6feb', '#0d419d'] },
  loops: { label: 'loop band', values: ['loops:0', 'loops:1-3', 'loops:>3'], colors: ['#3b434e', '#e3b341', '#f0883e'] },
};
for (const k of ['recursive', 'irreducible', 'jump-table', 'indirect-call', 'accelerator', 'ecall', 'generic-copy'])
  CLASS_DIMS[k] = { label: k, values: [k, 'not ' + k], colors: ['#f778ba', '#3b434e'] };
function classValue(f, dim) {
  const d = CLASS_DIMS[dim], cs = f.classes || [];
  if (dim === 'size' || dim === 'loops') return cs.find(c => d.values.includes(c)) || d.values[0];
  return cs.includes(dim) ? dim : 'not ' + dim;
}
const BADGES = {
  loops: { label: 'loops', color: '#e3b341', text: f => f.n_loops ? `L${f.n_loops}·d${f.max_loop_depth}` : null },
  joins: { label: 'joins', color: '#79c0ff', text: f => f.n_joins ? `J${f.n_joins}·${f.max_fanin}` : null },
  tables: { label: 'jump tables', color: '#d2a8ff', text: f => f.n_tables ? `T${f.n_tables}` : null },
  indirect: { label: 'indirect calls', color: '#f0883e', text: f => f.n_indirect ? `I${f.n_indirect}` : null },
  recursion: { label: 'recursion', color: '#f778ba', text: f => f.recursive ? 'rec' : null },
  irreducible: { label: 'irreducible', color: '#ff7b72', text: f => f.irreducible ? 'irr' : null },
  accel: { label: 'accelerators', color: '#a5d6ff', text: f => { const n = Object.values(f.csr || {}).reduce((a, b) => a + b, 0); return n ? `csr${Object.keys(f.csr).length}·${n}` : null; } },
  forms: { label: 'unsupported forms', color: '#ffa198', text: f => { const n = Object.keys(f.forms_unsupported || {}).length; return n ? `U${n}` : null; } },
  ecall: { label: 'ecall', color: '#56d4dd', text: f => f.ecall ? `ecall${f.ecall}` : null },
  open: { label: 'open items', color: '#f85149', text: f => f.open_items ? `open${f.open_items}` : null },
};
const RES_C = { exact: '#56d364', precondition: '#58a6ff', 'table-heuristic': '#f0883e', unresolved: '#f85149', direct: '#4c5564' };
// Codes of the flat arrays in data/fn/<id>.js (site.py BLOCK_KINDS, EXITS, EDGE_KINDS, CUT_WHY, CALL_KINDS).
const EXITS = [null, 'call', 'tail', 'table', 'ret'];
const BLOCK_KINDS = ['plain', 'join', 'loop_head'];
const EDGE_KINDS = ['fall', 'taken', 'jump', 'back', 'table'];
const CUT_WHY = ['entry', 'loop', 'ret', 'join'];
const CALL_KINDS = ['direct', 'indirect', 'tail'];

// ------------------------------------------------------------------ state and URL hash
const S = { view: 'program', fn: null, sel: null, layer: 'proof', cls: 'size', size: 'cuts',
            badges: new Set(), cut: null, block: null, unstack: new Set(), filter: null, drawer: null, hover: null };
function writeHash() {
  const p = new URLSearchParams();
  if (S.view === 'fn' && S.fn) p.set('fn', S.fn);
  if (S.sel) p.set('sel', S.sel);
  p.set('layer', S.layer);
  if (S.layer === 'class') p.set('cls', S.cls);
  if (S.size !== 'cuts') p.set('size', S.size);
  if (S.badges.size) p.set('badges', [...S.badges].join(','));
  if (S.cut != null) p.set('cut', hex(S.cut));
  if (S.block != null) p.set('block', hex(S.block));
  if (S.unstack.size) p.set('unstack', [...S.unstack].join('|'));
  if (S.filter) p.set('filter', S.filter);
  if (S.drawer) p.set('drawer', S.drawer);
  const h = '#' + p.toString().replace(/%2C/g, ',').replace(/%3A/g, ':').replace(/%7C/g, '|');
  if (location.hash !== h) history.replaceState(null, '', h);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const fn = p.get('fn');
  S.view = fn && FN.has(fn) ? 'fn' : 'program';
  S.fn = S.view === 'fn' ? fn : null;
  S.sel = FN.has(p.get('sel')) ? p.get('sel') : (S.fn || null);
  S.layer = LAYERS[p.get('layer')] ? p.get('layer') : 'proof';
  S.cls = CLASS_DIMS[p.get('cls')] ? p.get('cls') : 'size';
  S.size = ['cuts', 'instr', 'forecast'].includes(p.get('size')) ? p.get('size') : 'cuts';
  S.badges = new Set((p.get('badges') || '').split(',').filter(b => BADGES[b]));
  S.cut = p.get('cut') ? parseInt(p.get('cut'), 16) : null;
  S.block = p.get('block') ? parseInt(p.get('block'), 16) : null;
  S.unstack = new Set((p.get('unstack') || '').split('|').filter(s => ITEM.has(s)));
  S.filter = p.get('filter') || null;
  S.drawer = ['queue', 'metrics', 'trend'].includes(p.get('drawer')) ? p.get('drawer') : null;
}

// ------------------------------------------------------------------ helpers
const tip = document.getElementById('tip');
function showTip(ev, text) { tip.textContent = text; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 10) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function layerValue(f) { return S.layer === 'class' ? classValue(f, S.cls) : LAYERS[S.layer].value(f); }
function layerColor(v) {
  if (S.layer === 'class') { const d = CLASS_DIMS[S.cls]; return d.colors[d.values.indexOf(v)] || '#3b434e'; }
  return LAYERS[S.layer].color(v) || '#3b434e';
}
function layerValues() { return S.layer === 'class' ? CLASS_DIMS[S.cls].values : LAYERS[S.layer].values; }
function passesFilter(f, filter = S.filter) {
  if (!filter) return true;
  const [kind, ...rest] = filter.split(':'); const v = rest.join(':');
  if (kind === 'v') return layerValue(f) === v;
  if (kind === 'b') return !!(BADGES[v] && BADGES[v].text(f));
  if (kind === 'ids') return v.split(',').includes(f.id);
  return true;
}
const shortName = n => n.length > 34 ? n.slice(0, 32) + '…' : n;
function radiusOf(fid) {
  const r = FPOS[fid].r;
  return (S.size === 'forecast' && r.forecast == null) ? r.cuts : (r[S.size] ?? r.cuts);
}
function itemRadius(it) { return (S.size === 'forecast' && it.r.forecast == null) ? it.r.cuts : (it.r[S.size] ?? it.r.cuts); }
const expanded = it => it.kind === 'fn' || S.unstack.has(it.id);
function disp(fid) { const it = ITEM.get(FPOS[fid].item); return expanded(it) ? fid : it.id; }
function dispPos(d) { if (FN.has(d)) { const p = FPOS[d]; return [p.x, p.y]; } const it = ITEM.get(d); return [it.x, it.y]; }
function dispR(d) { return FN.has(d) ? radiusOf(d) : itemRadius(ITEM.get(d)); }
function dispMembers(d) { return FN.has(d) ? [d] : ITEM.get(d).members; }
// Quadtree hit-test over rectangles stored as {cx, cy, hw, hh}: every hit containing (x, y).
function hitRects(qt, x, y, R) {
  const hits = [];
  qt.visit((node, x0, y0, x1, y1) => {
    if (!node.length) { let n = node; do { const d = n.data; if (Math.abs(d.cx - x) <= d.hw && Math.abs(d.cy - y) <= d.hh) hits.push(d); } while ((n = n.next)); }
    return x0 > x + R || x1 < x - R || y0 > y + R || y1 < y - R;
  });
  return hits;
}

// ------------------------------------------------------------------ controls
const selLayer = document.getElementById('layer'), selCls = document.getElementById('cls'), selSize = document.getElementById('size');
for (const [k, l] of Object.entries(LAYERS)) selLayer.add(new Option(l.label, k));
for (const [k, d] of Object.entries(CLASS_DIMS)) selCls.add(new Option(d.label, k));
const haveForecast = IX.functions.some(f => f.forecast != null);
for (const [k, l] of [['cuts', 'cut points'], ['instr', 'instructions'], ['forecast', haveForecast ? 'forecast $' : 'forecast $ (no data)']]) selSize.add(new Option(l, k));
selLayer.onchange = () => { S.layer = selLayer.value; S.filter = null; render(); };
selCls.onchange = () => { S.cls = selCls.value; S.filter = null; render(); };
selSize.onchange = () => { S.size = selSize.value; render(); };
const badgeMenu = document.getElementById('badgemenu');
for (const [k, b] of Object.entries(BADGES)) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" value="${k}"> <span class="pill" style="background:${b.color}">${esc(b.label)}</span>`;
  l.querySelector('input').onchange = ev => { ev.target.checked ? S.badges.add(k) : S.badges.delete(k); render(); };
  badgeMenu.appendChild(l);
}
document.getElementById('badgebtn').onclick = () => document.getElementById('badgebox').classList.toggle('open');
document.getElementById('clearfilter').onclick = () => { S.filter = null; render(); };
const dl = document.getElementById('names');
for (const f of IX.functions) { const o = document.createElement('option'); o.value = f.name; o.label = `${f.id} ${hex(f.entry)}`; dl.appendChild(o); }
function findFn(q) {
  q = q.trim(); if (!q) return null;
  for (const f of IX.functions) if (f.id === q || f.name === q || f.status_id === q) return f;
  const pc = /^(0x)?[0-9a-f]+$/i.test(q) ? parseInt(q, 16) : NaN;
  if (!isNaN(pc)) { const f = IX.functions.find(f => f.entry === pc); if (f) return f; }
  const hits = IX.functions.filter(f => f.name.toLowerCase().includes(q.toLowerCase()));
  return hits.length ? hits.sort((a, b) => a.name.length - b.name.length)[0] : null;
}
document.getElementById('search').addEventListener('change', ev => {
  const f = findFn(ev.target.value);
  if (!f) { document.getElementById('counts').textContent = 'no match: ' + ev.target.value; return; }
  selectFn(f.id, true);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (S.view === 'fn') openProgram(); else { S.sel = null; S.filter = null; render(); } }
});

// ------------------------------------------------------------------ renderer
const stageEl = document.getElementById('stage');
let app = null, world = null, progScene = null, fnLayer = null, miniLayer = null;
const FONT = 'zmono';
let renderQueued = false;
function requestRender() { if (!renderQueued && app) { renderQueued = true; requestAnimationFrame(frame); } }
function frame() {
  renderQueued = false;
  // Culling: objects marked cullable outside the viewport are not rendered.
  if (PIXI.Culler) PIXI.Culler.shared.cull(world, { x: 0, y: 0, width: app.screen.width, height: app.screen.height }, false);
  app.renderer.render(app.stage);
}
function hasWebGL() {
  const c = document.createElement('canvas');
  return !!(c.getContext('webgl2') || c.getContext('webgl'));
}
async function initRenderer() {
  if (!hasWebGL()) { stageEl.insertAdjacentHTML('afterbegin', '<div id="nowebgl">This browser has no WebGL context; the graph cannot be drawn.</div>'); return false; }
  app = new PIXI.Application();
  // No MSAA: with software WebGL (SwiftShader, headless Chromium) it cut pan rates by half or more.
  await app.init({ resizeTo: stageEl, background: 0x0f1115, antialias: false, autoStart: false, preference: 'webgl',
                   resolution: window.devicePixelRatio || 1, autoDensity: true });
  app.ticker.stop();
  stageEl.prepend(app.canvas);
  PIXI.BitmapFont.install({ name: FONT, style: { fontFamily: 'DejaVu Sans Mono, ui-monospace, monospace', fontSize: 28, fill: 0xffffff },
                            chars: [[' ', '~'], '·→×…⋔–▸'], resolution: 1, padding: 2 });
  world = new PIXI.Container();
  app.stage.addChild(world);
  miniLayer = new PIXI.Container(); miniLayer.visible = false;
  app.stage.addChild(miniLayer);
  new ResizeObserver(() => requestRender()).observe(stageEl);
  return true;
}
function btext(text, size, color, anchorX = 0, anchorY = 0) {
  const t = new PIXI.BitmapText({ text, style: { fontFamily: FONT, fontSize: size } });
  t.tint = color; t.anchor.set(anchorX, anchorY); t.cullable = true;
  return t;
}
// Path helpers: Graphics accepts moveTo/lineTo/bezierCurveTo, so d3.line can draw into it.
function polyline(g, p) { g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); }
function basis(g, pts) { d3.line().curve(d3.curveBasis).context(g)(pts); }
function flatten(pts, curve) {     // sample a d3 curve into a flat point list (for dashes)

// ------------------------------------------------------------------ pointer events (no per-object listeners)
function wireEvents() {
  const cv = app.canvas;
  zoom = d3.zoom().scaleExtent([0.01, 8]).on('zoom', onZoom);
  d3.select(cv).call(zoom).on('dblclick.zoom', null);
  cv.addEventListener('click', ev => {
    if (inMini(ev)) { openProgram(); return; }
    if (S.view === 'program') {
      const o = programHit(ev);
      if (!o) { if (S.sel) { S.sel = null; render(); } return; }
      if (o.stack) { S.unstack.add(o.d); render(); return; }
      selectFn(o.d, false);
      return;
    }
    const h = fnHit(ev); if (!h) return;
    if (h.type === 'block') {
      const fd = FS.get(S.fn).fd, pc = fd.blocks.start[h.i];
      S.block = S.block === pc ? null : pc;
      if (fd.leaf_paths[String(pc)]) S.cut = pc;
      render(); return;
    }
    if (FN.has(h.s.key)) { S.block = null; S.sel = h.s.key; render(); }
    else { S.block = null; panel.innerHTML = `<h2>${esc(h.s.label)}</h2><pre>${esc((h.s.targets || []).join('\n'))}</pre>`; }
  });
  cv.addEventListener('dblclick', ev => {
    if (S.view === 'program') { const o = programHit(ev); if (o && !o.stack) openFn(o.d); return; }
    const h = fnHit(ev); if (h && h.type === 'stub' && FN.has(h.s.key)) openFn(h.s.key);
  });
  cv.addEventListener('pointermove', ev => {
    if (ev.buttons) { hideTip(); return; }
    if (S.view === 'program') {
      const o = programHit(ev);
      if (o) { const it = o.stack ? ITEM.get(o.d) : null; showTip(ev, o.stack ? `${it.stem} ×${o.members.length} (same stem)\nclick: unstack\n` + o.members.map(m => FN.get(m).name).join('\n') : fnTip(FN.get(o.d))); cv.style.cursor = 'pointer'; return; }

      if (x) { showTip(ev, `${x.fns.map(e => FN.get(e.from).name + ' → ' + FN.get(e.to).name).slice(0, 4).join('\n')}${x.fns.length > 4 ? '\n…' : ''}\n${x.sites} call sites: direct ${x.direct}, tail ${x.tail}, indirect ${x.indirect}${x.res.size ? ' (' + [...x.res].join(', ') + ')' : ''}${x.noreturn ? '\ncallee never returns' : ''}`); cv.style.cursor = 'default'; return; }
    } else {
      const h = fnHit(ev);
      if (h) { const fd = FS.get(S.fn).fd; showTip(ev, h.type === 'block' ? `block ${hex(fd.blocks.start[h.i])} · ${fd.blocks.n[h.i]} instructions · ${BLOCK_KINDS[fd.blocks.kind[h.i]]}` : `${h.s.label}${FN.has(h.s.key) ? '\nclick: select   double-click: open' : ''}`); cv.style.cursor = 'pointer'; return; }
    }
    hideTip(); cv.style.cursor = 'default';
  });
  cv.addEventListener('pointerleave', hideTip);
}

    ['instr / cuts', `${f.n_instr} / ${f.n_cuts}`],
    ['loops', `${f.n_loops} (deepest ${f.max_loop_depth})`],
    ['joins', `${f.n_joins} (largest fan-in ${f.max_fanin})`],
    ['calls', `${f.n_calls} (indirect ${f.n_indirect}${f.n_indirect ? ': ' + esc(Object.entries(f.indirect_resolution).map(([k, v]) => k + ' ' + v).join(', ')) : ''})`],
    ['jump tables', f.n_tables],
    ['flags', [f.recursive && 'recursive', f.irreducible && 'irreducible', f.noreturn && 'never returns'].filter(Boolean).join(', ') || '—'],
    ['unsupported', esc(Object.entries(f.forms_unsupported).map(([k, v]) => `${k} ${v}`).join(', ') || '—')],
    ['CSR', esc(Object.entries(f.csr).map(([k, v]) => `${k} ${v}`).join(', ') || '—')],
    ['ecall', f.ecall || '—'],
    ['leaves', `auto ${f.leaves.auto}, manual ${f.leaves.manual}, open ${f.leaves.open}`],
    ['open items', f.open_items],
    ['automatic share', f.auto_share == null ? '—' : Math.round(f.auto_share * 100) + '%'],
    ['hand-typed minutes', f.cost ? '— (replaced by session-log cost)' : `${f.minutes_typed} (ledger, ${f.ledger_items} items, typed by hand)`],
    ['cost (session logs)', f.cost == null ? 'no data' : esc(`$${(+f.cost.usd || 0).toFixed(2)} · ${f.cost.minutes ?? '?'} min · ${f.cost.items ?? '?'} items`)],
    ['forecast', f.forecast == null ? 'no data' : esc(typeof f.forecast === 'object' ? `p25 ${f.forecast.p25} · p50 ${f.forecast.p50} · p75 ${f.forecast.p75}` : f.forecast)],
    ['source', esc(f.src_file || '—')],
    ['callers', [...callers.get(id)].map(fnLink).join(', ') || '—'],
    ['callees', [...callees.get(id)].map(fnLink).join(', ') || '—'],
  ]);
  const fd = FNDATA.get(id), dt = DETAIL.get(id);
  if (fd && fd.vc_cuts.length) {
    h += '<h3>proof cuts (click: leaf paths)</h3>' + fd.vc_cuts.map(vc => `<div class="rowlink" data-cut="${vc.pc}" style="${vc.pc === S.cut ? 'color:#ffd54a' : ''}">${hex(vc.pc)} cut lemma ${esc(vc.cut_lemma)} · ${vc.n_leaves} leaves</div>`).join('');
  }
  if (S.view === 'fn' && S.cut != null && fd && fd.leaf_paths[String(S.cut)]) {
    const lp = fd.leaf_paths[String(S.cut)];
    h += `<h3>leaves of cut ${hex(S.cut)}</h3>` + lp.leaves.map(l => `<div><span class="pill" style="background:${LEAF_C[l.state] || '#6e7681'}">${esc(l.state)}</span>#${l.i} ${esc(l.exit)} ${l.target != null ? hex(l.target) : ''} · ${l.steps} steps${l.approx ? ' · approx path' : ''}${l.thm ? `<div class="muted">${esc(l.thm.name)} (${esc(l.thm.file)}:${esc((l.thm.lines || []).join('–'))}, ${esc(l.thm.rule)})</div>` : ''}${l.state !== 'auto' && l.residual ? '<div class="muted">' + esc(l.residual) + '</div>' : ''}</div>`).join('');
  }
  h += '<h3>card (zmap show)</h3>' + (dt ? `<pre>${esc(dt.card)}</pre>` : '<div class="muted">loading…</div>');
  panel.innerHTML = h;
  const ob = document.getElementById('openfn'); if (ob) ob.onclick = () => openFn(id);
  const bb = document.getElementById('backprog'); if (bb) bb.onclick = openProgram;
  const rs = document.getElementById('restack'); if (rs) rs.onclick = () => { S.unstack.delete(FPOS[id].item); render(); };
  for (const el of panel.querySelectorAll('[data-cut]')) el.onclick = () => { const pc = +el.dataset.cut; if (S.view !== 'fn') { S.cut = pc; openFn(id); } else { S.cut = S.cut === pc ? null : pc; S.block = null; render(); } };
  wireLinks();
  if (!fd && S.view === 'fn') loadFn(id).then(() => { if ((S.sel || S.fn) === id) renderCard(); });
  if (!dt) loadDetail(id).then(() => { if ((S.sel || S.fn) === id && S.block == null) renderCard(); }, () => {});
}
function wireLinks() {
  for (const el of panel.querySelectorAll('[data-fn]')) el.onclick = () => selectFn(el.dataset.fn, true);
}
function renderBlockPanel() {
  const fd = FNDATA.get(S.fn), i = blockIndex(fd).get(S.block);
  if (i == null) { S.block = null; return renderCard(); }
  const B = fd.blocks, start = B.start[i], dt = DETAIL.get(S.fn);
  const ci = fd.cuts.pc.indexOf(start), cut = ci >= 0 ? CUT_WHY[fd.cuts.why[ci]] : null, vc = fd.vc_cuts.find(c => c.pc === start);
  const ji = fd.joins.at.indexOf(start), li = fd.loops.head.indexOf(start);
  const f = FN.get(S.fn), file = B.file[i] >= 0 ? fd.files[B.file[i]] : null;
  const succ = [];
  for (let k = 0; k < fd.edges.from.length; k++) if (fd.edges.from[k] === i) succ.push(B.start[fd.edges.to[k]]);
  let h = `<h2>block ${hex(start)}–${hex(B.end[i])}</h2><div class="muted">${esc(fd.name)} · ${B.n[i]} instructions · ${BLOCK_KINDS[B.kind[i]]}</div>`;
  h += `<div style="margin:6px 0"><button id="tocard">function card</button> <button id="backprog">back to program</button></div>`;
  h += kv([
    ['cut', cut || vc ? esc(cut || 'proof cut') + (vc ? ` · proof cut, cut lemma ${esc(vc.cut_lemma)}, ${vc.n_leaves} leaves` + (vc.thm ? `<br>${esc(vc.thm.name)} (${esc(vc.thm.file)}:${esc((vc.thm.lines || []).join('–'))}, ${esc(vc.thm.rule)})` : '') : '') : '—'],
    ['loop head', li >= 0 ? `${fd.loops.n[li]} blocks` : '—'],
    ['join', ji >= 0 ? `${fd.joins.fanin[ji]} incoming paths` : '—'],
    ['successors', [...new Set(succ)].map(hex).join(' ') || '—'],
    ['source', file ? esc(`${file}:${B.lo[i]}–${B.hi[i]}`) : 'no source line'],
    ['inline frame', B.inl[i] >= 0 ? esc(fd.inlines[B.inl[i]]) : '—'],
    ['glyphs', esc(Object.entries(fd.glyphs[i] || {}).map(([k, v]) => `${k} ×${v}`).join(', ') || '—')],
    ['theorems', (Object.entries(f.theorem_names || {}).filter(([k, v]) => v).map(([k, v]) => esc(`${k}: ${v}`)).join('<br>') || '—')],
  ]);
  let dis = 'loading…', srcText = 'loading…';
  if (dt) {
    dis = dt.dis[i].length ? dt.dis[i].map(([pc, t]) => hex(pc).slice(2) + '  ' + t).join('\n') : (fd.disassembly ? '' : 'no disassembly (site built without --elf)');
    const src = file && dt.source[file];
    srcText = 'no source line';
    if (src) { const rows = []; for (let ln = B.lo[i]; ln <= B.hi[i]; ln++) if (src[ln] != null) rows.push(String(ln).padStart(5) + '  ' + src[ln]); srcText = rows.join('\n') || 'source file not available'; }
  } else loadDetail(S.fn).then(() => { if (S.block === start) renderBlockPanel(); }, err => { panel.insertAdjacentHTML('beforeend', `<div class="err">${esc(err.message)}</div>`); });
  h += `<h3>disassembly · Zig source</h3><div class="dis"><div>${esc(dis)}</div><div>${esc(srcText)}</div></div>`;
  panel.innerHTML = h;
  document.getElementById('tocard').onclick = () => { S.block = null; render(); };
  document.getElementById('backprog').onclick = openProgram;
}

// ------------------------------------------------------------------ navigation
function selectFn(id, centre) {
  S.sel = id;
  if (S.view === 'fn' && id !== S.fn) { openFn(id); return; }
  const it = ITEM.get(FPOS[id].item);
  if (it.kind === 'stack' && !S.unstack.has(it.id) && centre) S.unstack.add(it.id);
  render();
  if (centre && S.view === 'program') {
    const [x, y] = dispPos(disp(id));
    const k = Math.max(currentT().k, 1);
    d3.select(app.canvas).transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(stageEl.clientWidth / 2 - x * k, stageEl.clientHeight / 2 - y * k).scale(k));
  }
}
function openFn(id) {
  if (S.fn !== id) { S.cut = null; S.block = null; }
  S.view = 'fn'; S.fn = id; S.sel = id;
  render();
}
function openProgram() { S.view = 'program'; S.fn = null; S.cut = null; S.block = null; render(); }
let shownFn = null;
function render() {
  document.getElementById('badgebox').classList.remove('open');
  selLayer.value = S.layer; selCls.value = S.cls; selCls.style.display = S.layer === 'class' ? '' : 'none'; selSize.value = S.size;
  for (const el of badgeMenu.querySelectorAll('input')) el.checked = S.badges.has(el.value);
  document.getElementById('clearfilter').style.display = S.filter ? '' : 'none';
  const crumb = document.getElementById('crumb');
  renderLegend(); renderDrawer();
  if (!app) { renderCard(); writeHash(); return; }
  if (S.view === 'program') {
    for (const sc of FS.values()) sc.c.visible = false;
    progScene.visible = true; miniLayer.visible = false; crumb.style.display = 'none'; shownFn = null;
    applyProgramStyle();
    const t = progT || fitProgram();
    if (String(currentT()) !== String(t)) setTransform(t); else programDetail(t.k);
    renderCard(); writeHash();
    return;
  }
  const id = S.fn;
  crumb.style.display = 'block';
  if (!FNDATA.has(id)) crumb.innerHTML = `<span class="rowlink" id="crumbprog">program</span> › <b>${esc(FN.get(id).name)}</b> <span class="muted">loading…</span>`;
  document.getElementById('crumbprog') && (document.getElementById('crumbprog').onclick = openProgram);
  renderCard(); writeHash();
  loadFn(id).then(fd => {
    if (S.fn !== id || S.view !== 'fn') return;
    let sc = FS.get(id);
    if (!sc) { sc = buildFn(fd); FS.set(id, sc); world.addChild(sc.c); }
    progScene.visible = false;
    for (const [k, s] of FS) s.c.visible = k === id;
    miniLayer.visible = true; placeMini();
    crumb.innerHTML = `<span class="rowlink" id="crumbprog">program</span> › <b>${esc(fd.name)}</b> <span class="muted">${fd.blocks.start.length} blocks · ${fd.calls.n.length} call sites · ${fd.loops.head.length} loops · WebGL</span>`;
    document.getElementById('crumbprog').onclick = openProgram;
    applyFnStyle();
    if (shownFn !== id) {
      shownFn = id;
      const t = fnT.get(id) || (S.block != null && focusBlockT(fd, S.block)) || fitFn(fd);
      setTransform(t);
    }
    fnDetail(currentT().k);
    renderCard(); renderLegend(); writeHash();
  }, err => { crumb.innerHTML += ' <span style="color:#f85149">' + esc(err.message) + '</span>'; });
}

// ------------------------------------------------------------------ drawer
function setDrawer(tab) { S.drawer = S.drawer === tab ? null : tab; render(); }
for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => setDrawer(b.dataset.tab);
function qDescribe(q) {
  if (q.type === 'leaf') return `cut ${hex(q.cut)} leaf #${q.i} exit ${q.exit}${q.target != null ? ' → ' + hex(q.target) : ''} · ${q.residual || ''}`;
  if (q.type === 'cut_lemma') return `cut lemma at ${hex(q.cut)}`;
  if (q.type === 'function') return `${q.n_instr} instr · ${q.cuts_needing_assertions} cuts need assertions · ${q.loops_needing_measure} loops need a measure${q.contract_missing ? ' · contract missing' : ''}`;
  if (q.type === 'blocker') return `${q.functions.length} functions · ${q.target_instr} target instructions`;
  return '';
}
let drawerShown = null;
function renderDrawer() {
  document.documentElement.style.setProperty('--drawer', S.drawer ? '34vh' : '30px');
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.tab === S.drawer);
  document.getElementById('drawerhint').textContent = S.drawer ? 'hover a row: highlight its node · click: select' : 'drawer closed; click a tab';
  const body = document.getElementById('drawerbody');
  if (drawerShown === S.drawer) return;
  drawerShown = S.drawer;
  if (!S.drawer) { body.innerHTML = ''; return; }
  if (S.drawer === 'queue') {
    const rows = IX.queue || [];
    body.innerHTML = `<table><tr><th>#</th><th>type</th><th>function / blocker</th><th>item</th></tr>` +
      rows.map((q, i) => `<tr class="row" data-i="${i}"><td>${q.rank}</td><td>${esc(q.type)}</td><td>${esc(q.type === 'blocker' ? q.key : q.name)}</td><td>${esc(qDescribe(q))}</td></tr>`).join('') + '</table>';
    for (const tr of body.querySelectorAll('tr.row')) {
      const q = rows[+tr.dataset.i];
      const ids = q.type === 'blocker' ? q.functions.filter(id => FN.has(id)) : [q.fn];
      tr.onmouseenter = () => { S.hover = ids[0]; if (S.view === 'program' && app) applyProgramStyle('ids:' + ids.join(',')); };
      tr.onmouseleave = () => { S.hover = null; if (S.view === 'program' && app) applyProgramStyle(); };
      tr.onclick = () => {
        if (q.type === 'blocker') { S.filter = 'ids:' + ids.join(','); S.sel = null; if (S.view !== 'program') openProgram(); else render(); return; }
        if (q.cut != null) { S.cut = q.cut; S.block = null; S.sel = q.fn; if (S.fn !== q.fn) fnT.delete(q.fn); S.view = 'fn'; S.fn = q.fn; render(); return; }
        selectFn(q.fn, true);
      };
    }
  } else if (S.drawer === 'metrics') {
    body.innerHTML = IX.metrics ? `<pre>${esc(JSON.stringify(IX.metrics, null, 1).slice(0, 20000))}</pre>` : '<p class="muted">Metrics: no data (map/metrics.json).</p>';
  } else {
    body.innerHTML = IX.history ? `<p>${IX.history.length} history rows (time slider: S9.2)</p>` : '<p class="muted">Trend: no data (map/history.jsonl).</p>';
  }
}

// ------------------------------------------------------------------ start
window.ZV = { S, render, openFn, openProgram, selectFn, setTransform, currentT, FNDATA, FS, P, get app() { return app; } };
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash();
initRenderer().then(ok => {
  if (ok) { buildProgram(); buildMini(); wireEvents(); progT = null; }
  render();
}, err => {
  stageEl.insertAdjacentHTML('afterbegin', `<div id="nowebgl">This browser has no WebGL context; the graph cannot be drawn. (${esc(err.message)})</div>`);
  render();
});
</script>
