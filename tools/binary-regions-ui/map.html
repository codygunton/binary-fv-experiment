<!doctype html>
<meta charset="utf-8">
<title>Zesu proof map (zmap)</title>
<!--
  Data: map-data.js assigns window.ZMAP (map.json) and window.ZQUEUE (queue.json); written by
  `python3 -m zmap site` (or `make -C exec-spike/tools/zmap map`) into exec-spike/map/site/ with a
  copy of this page. Opened from tools/binary-regions-ui/ it falls back to that site's data file.
  No server needed (file://).
-->
<style>
 :root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--fg:#dfe4ec;--dim:#8a93a3}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;
      font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 h1{font-size:13px;margin:0;font-weight:600}
 button,select,input{background:#1e242e;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:inherit}
 button{cursor:pointer} button.on{background:#33404f;border-color:#5a6b80}
 a{color:#8ab4f8}
 .muted{color:var(--dim)}
 #legend span{display:inline-flex;align-items:center;gap:4px;margin-right:9px}
 #legend i{display:inline-block;width:11px;height:11px;border-radius:2px}
 #counts{color:var(--dim)}
 main{position:absolute;top:var(--top,64px);bottom:0;left:0;right:0;display:grid;grid-template-columns:minmax(0,1fr) 420px}
 #view{position:relative;overflow:auto;min-width:0}
 #side{border-left:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel);white-space:pre-wrap}
 .controls{padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
 svg text{fill:#111;font-size:10px;pointer-events:none}
 svg .lbl{fill:var(--fg)}
 table{border-collapse:collapse;margin:10px}
 td,th{border:1px solid var(--line);padding:3px 7px;text-align:left;vertical-align:top}
 th{background:#1b2028}
 tr.click{cursor:pointer} tr.click:hover{background:#1d232d}
 .edge{fill:none;stroke:#6b7686;stroke-width:1.2}
 .edge.taken{stroke:#9fb3c8}.edge.back{stroke:#e8834a;stroke-dasharray:5 3;stroke-width:1.8}
 .edge.table{stroke:#c58af9;stroke-dasharray:2 3;stroke-width:1.6}
 .leafarc{fill:none;stroke-width:2.4;opacity:.85}
 .block{stroke:#2c3440;stroke-width:1}
 .block.cut{stroke:#ffd54a;stroke-width:3}
 .block.sel{stroke:#fff;stroke-width:3}
 .call{stroke:#27313d;stroke-width:1}
 h3{margin:10px 0 4px;font-size:12px}
 .err{padding:30px;color:#f3aaaa;white-space:pre-wrap}
</style>
<header>
  <h1>Zesu proof map</h1>
  <span id="tabs"></span>
  <span id="legend"></span>
  <span id="counts"></span>
</header>
<main><div id="view"></div><div id="side"></div></main>
<script src="vendor/d3.min.js"></script>
<script src="map-data.js"></script>
<script>
'use strict';
const STATE_COLORS = {
  'closed+compliance': '#2e9e5b', 'closed+sail': '#6fd08c', 'closed': '#a8e6b8',
  'conditional': '#9fd3ff', 'in-proof': '#ffe39a', 'contract-draft': '#f5c27a',
  'assumed': '#c9b6ff', 'blocked': '#f3aaaa', 'ready': '#ffffff', 'waiting': '#9aa4b2', 'out': '#3a414c'};
const LEAF_COLORS = {auto: '#6fd08c', manual: '#8ab4f8', open: '#ff6b6b'};
const TABS = ['Overview', 'Function', 'Calls', 'Queue', 'Cost', 'Trust'];
const hex = n => (n === null || n === undefined) ? '-' : '0x' + Number(n).toString(16);
let M, Q, byId, current = null, tab = 'Overview';

function boot() {
  if (!window.ZMAP) {
    // Opened from tools/binary-regions-ui/: use the generated site's data.
    const s = document.createElement('script');
    s.src = '../../exec-spike/map/site/map-data.js';
    s.onload = start;
    s.onerror = () => { document.getElementById('view').innerHTML =
      '<div class="err">No map data. Run `make -C exec-spike/tools/zmap map` and open exec-spike/map/site/map.html.</div>'; };
    document.head.appendChild(s);
  } else start();
}

function start() {
  M = window.ZMAP; Q = window.ZQUEUE || [];
  byId = new Map(M.functions.map(f => [f.id, f]));
  const legend = d3.select('#legend');
  for (const [s, c] of Object.entries(STATE_COLORS))
    legend.append('span').html(`<i style="background:${c}"></i>${s}`);
  const sc = M.state_counts;
  d3.select('#counts').text(`${M.functions.length} functions · ` +
    Object.entries(sc).filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(' · '));
  const tabs = d3.select('#tabs');
  for (const t of TABS) tabs.append('button').attr('id', 'tab-' + t).text(t).on('click', () => show(t));
  document.documentElement.style.setProperty('--top', document.querySelector('header').offsetHeight + 'px');
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && byId.has(h)) { current = byId.get(h); show('Function'); } else show('Overview');
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (byId.has(id) && (!current || current.id !== id)) { current = byId.get(id); show(tab === 'Calls' ? 'Calls' : 'Function'); }
  });
}

function show(t) {
  tab = t;
  d3.selectAll('#tabs button').classed('on', false);
  d3.select('#tab-' + t).classed('on', true);
  const view = d3.select('#view'); view.selectAll('*').remove();
  d3.select('#side').text('');
  ({Overview: overview, Function: fnView, Calls: callsView, Queue: queueView, Cost: costView, Trust: trustView})[t](view);
}

function openFn(f, t = 'Function') { current = f; location.hash = f.id; show(t); }

// ---------------------------------------------------------------- Overview
let ovSize = 'n_instr', ovSet = 'all', ovSearch = '';
function overview(view) {
  const c = view.append('div').attr('class', 'controls');
  c.append('span').text('area');
  const sel = c.append('select').on('change', e => { ovSize = e.target.value; show('Overview'); });
  for (const [v, l] of [['n_instr', 'instructions'], ['leaves', 'leaves_estimate (log10)'], ['open', 'open items']])
    sel.append('option').attr('value', v).property('selected', v === ovSize).text(l);
  c.append('span').text('set');
  const ss = c.append('select').on('change', e => { ovSet = e.target.value; show('Overview'); });
  for (const v of ['all', 'target', 'maybe', 'other']) ss.append('option').property('selected', v === ovSet).text(v);
  c.append('input').attr('placeholder', 'search name / id').property('value', ovSearch)
    .on('change', e => { ovSearch = e.target.value; show('Overview'); });
  const fns = M.functions.filter(f => (ovSet === 'all' || f.set === ovSet) &&
    (!ovSearch || f.name.includes(ovSearch) || f.id.includes(ovSearch)));
  const value = f => ovSize === 'n_instr' ? f.n_instr : ovSize === 'open' ? f.open_items :
    Math.log10(1 + Number(f.leaves_estimate));
  c.append('span').attr('class', 'muted').attr('id', 'ov-count').text(`${fns.length} functions shown`);
  const node = view.node(), W = node.clientWidth - 4, H = node.clientHeight - 44;
  const groups = d3.groups(fns, f => f.state).map(([s, fs]) => ({name: s, children: fs.map(f => ({f}))}));
  const root = d3.hierarchy({children: groups}).sum(d => d.f ? value(d.f) : 0)
    .sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).paddingTop(d => d.depth === 1 ? 14 : 0).paddingInner(1)(root);
  const svg = view.append('svg').attr('width', W).attr('height', H);
  for (const g of root.children || [])
    svg.append('text').attr('class', 'lbl').attr('x', g.x0 + 3).attr('y', g.y0 + 11)
      .text(`${g.data.name} (${g.children.length})`);
  const leaf = svg.selectAll('g.f').data(root.leaves().filter(d => d.data.f)).join('g')
    .attr('transform', d => `translate(${d.x0},${d.y0})`).style('cursor', 'pointer')
    .on('click', (e, d) => openFn(d.data.f))
    .on('mouseover', (e, d) => d3.select('#side').text(card(d.data.f)));
  leaf.append('rect').attr('width', d => Math.max(0, d.x1 - d.x0)).attr('height', d => Math.max(0, d.y1 - d.y0))
    .attr('fill', d => STATE_COLORS[d.data.f.state]).attr('stroke', '#0f1115');
  leaf.append('title').text(d => `${d.data.f.name}\n${d.data.f.id} ${d.data.f.state} ${d.data.f.n_instr} instr`);
  leaf.filter(d => d.x1 - d.x0 > 60 && d.y1 - d.y0 > 12).append('text').attr('x', 3).attr('y', 10)
    .text(d => d.data.f.name.slice(0, Math.floor((d.x1 - d.x0) / 6)));
}

// ---------------------------------------------------------------- Function card
function card(f) {
  const L = [`${f.id}  ${f.name}${f.status_id ? '  (' + f.status_id + ')' : ''}`,
    `state: ${f.state}${f.legacy ? '  legacy' : ''}   set: ${f.set}`,
    `entry ${hex(f.entry)}  size ${f.size}  instr ${f.n_instr}  order ${f.order}`,
    'theorems: ' + Object.entries(f.theorems).map(([k, v]) => `${k}=${v ? 'yes' : 'no'}`).join(', ')];
  if (f.theorem_names) L.push('names: ' + Object.entries(f.theorem_names).filter(([, v]) => v).map(([k, v]) => `${k}=${v}`).join(', '));
  L.push(f.contract ? `contract: ${f.contract.contract}/${f.contract.review}\n  ${f.contract.source}` : 'contract: none');
  L.push(`blockers: ${f.blockers.length}`);
  for (const b of f.blockers) L.push(`  ${b.kind}: ${Array.isArray(b.detail) ? b.detail.slice(0, 8).map(x => typeof x === 'number' ? hex(x) : x).join(' ') + (b.detail.length > 8 ? ' …' : '') : JSON.stringify(b.detail)}`);
  L.push(`cuts: ${f.cuts.length}  ` + f.cuts.map(c => `${hex(c.pc)}:${c.why}`).join(' '));
  L.push(`loops: ${f.loops.length}  ` + f.loops.map(l => hex(l.head)).join(' '));
  L.push(`joins: ${f.joins.length}; join cut candidates: ${f.join_cut_candidates.map(hex).join(' ') || '-'}`);
  L.push(`leaves_estimate: ${f.leaves_estimate}`);
  L.push(`calls: ${f.calls.length}`);
  for (const c of f.calls.slice(0, 40)) L.push(`  ${hex(c.site)} ${c.kind}/${c.resolution}${c.noreturn ? ' noreturn' : ''}: ` +
    (c.targets.slice(0, 3).map(t => `${byId.get(t).name} [${byId.get(t).state}]`).join(', ') || '-') +
    (c.targets.length > 3 ? ` (+${c.targets.length - 3})` : ''));
  L.push('leaves: ' + Object.entries(f.leaves).map(([k, v]) => `${k} ${v}`).join(', ') +
    '; cut lemmas: ' + Object.entries(f.cut_lemmas).map(([k, v]) => `${k} ${v}`).join(', '));
  const lt = f.ledger.all;
  L.push(`ledger: ${lt.items} items, ${lt.minutes} min, $${lt.usd}`);
  return L.join('\n');
}

// ---------------------------------------------------------------- Function (CFG)
function pickFn(view, label) {
  const c = view.append('div').attr('class', 'controls');
  c.append('span').text(label);
  const inp = c.append('input').attr('list', 'fnlist').attr('size', 60)
    .attr('placeholder', 'function name or id').property('value', current ? current.name : '');
  const dl = c.append('datalist').attr('id', 'fnlist');
  dl.selectAll('option').data(M.functions).join('option').attr('value', f => f.name);
  inp.on('change', e => {
    const v = e.target.value;
    const f = M.functions.find(g => g.name === v || g.id === v);
    if (f) openFn(f, tab);
  });
  return c;
}

function fnView(view) {
  const c = pickFn(view, 'function');
  if (!current) { view.append('p').style('padding', '10px').text('Pick a function (or click one in Overview).'); return; }
  const f = current;
  c.append('span').attr('class', 'muted').attr('id', 'fn-summary')
    .text(`${f.blocks.length} blocks · ${f.loops.length} loop heads · ${f.cuts.length} cuts · ${f.joins.length} joins · state ${f.state}`);
  const side = d3.select('#side');
  const cuts = new Map(f.cuts.map(c => [c.pc, c.why]));
  const callAt = new Map(); // block start -> call
  const blockOf = pc => f.blocks.find(b => b.start <= pc && pc < b.end);
  for (const cl of f.calls) { const b = blockOf(cl.site); if (b) callAt.set(b.start, cl); }
  const blockerPcs = new Set();
  for (const b of f.blockers) if (Array.isArray(b.detail)) for (const x of b.detail.flat()) if (typeof x === 'number') blockerPcs.add(x);
  const DX = 150, DY = 46, BW = 120, BH = 24;
  const pos = new Map(f.blocks.map(b => [b.start, {x: 20 + b.x * DX, y: 20 + b.y * DY, b}]));
  const W = 60 + d3.max(f.blocks, b => b.x) * DX + BW, H = 60 + d3.max(f.blocks, b => b.y) * DY + BH;
  const svg = view.append('svg').attr('width', '100%').attr('height', view.node().clientHeight - 40);
  const g = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.05, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);
  const vw = view.node().clientWidth;
  if (W > vw) svg.call(zoom.transform, d3.zoomIdentity.scale(Math.max(0.05, vw / W)));
  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arr').attr('viewBox', '0 0 8 8').attr('refX', 8).attr('refY', 4)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0L8,4L0,8z').attr('fill', '#9aa4b2');
  const path = (a, b, bend) => {
    const x1 = a.x + BW / 2, y1 = a.y + BH, x2 = b.x + BW / 2, y2 = b.y;
    if (y2 > y1) return `M${x1},${y1}C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
    const off = bend * (40 + Math.abs(y1 - y2) * 0.15);
    return `M${a.x + BW},${a.y + BH / 2}C${a.x + BW + off},${a.y} ${b.x + BW + off},${b.y + BH} ${b.x + BW},${b.y + BH / 2}`;
  };
  g.selectAll('path.edge').data(f.edges).join('path').attr('class', e => 'edge ' + e.kind)
    .attr('marker-end', 'url(#arr)').attr('d', e => path(pos.get(e.from), pos.get(e.to), 1))
    .append('title').text(e => `${e.kind} ${hex(e.from)} -> ${hex(e.to)}`);
  // Leaves of the proof status: an arc from the cut's block to the exit target's block.
  const leaves = [];
  for (const cc of f.vc_cuts || []) for (const l of cc.leaves) leaves.push({cut: cc.pc, ...l});
  g.selectAll('path.leafarc').data(leaves.filter(l => l.cfg.cut_block !== null && l.cfg.target_block !== null))
    .join('path').attr('class', 'leafarc').attr('stroke', l => LEAF_COLORS[l.state] || '#fff')
    .attr('d', l => path(pos.get(l.cfg.cut_block), pos.get(l.cfg.target_block), -1))
    .append('title').text(l => `leaf ${hex(l.cut)} #${l.i} ${l.state} exit ${l.exit}`);
  const nodes = g.selectAll('g.n').data(f.blocks).join('g').attr('class', 'n')
    .attr('transform', b => `translate(${pos.get(b.start).x},${pos.get(b.start).y})`).style('cursor', 'pointer')
    .on('click', (e, b) => { g.selectAll('rect.block').classed('sel', d => d === b); side.text(blockText(f, b, cuts, callAt) + '\n\n' + card(f) + leafText(leaves)); });
  nodes.append('rect').attr('class', b => 'block' + (cuts.has(b.start) ? ' cut' : '')).attr('width', BW).attr('height', BH).attr('rx', 3)
    .attr('fill', b => b.kind === 'loop_head' ? '#ffb86b' : b.kind === 'join' ? '#9fd3ff' : '#dfe4ec');
  nodes.append('text').attr('x', 4).attr('y', 15).text(b => `${hex(b.start).slice(-5)} n${b.n}` + (cuts.has(b.start) ? ' ' + cuts.get(b.start) : ''));
  nodes.filter(b => callAt.has(b.start)).append('circle').attr('class', 'call').attr('cx', BW - 7).attr('cy', BH / 2).attr('r', 5)
    .attr('fill', b => { const cl = callAt.get(b.start); return cl.kind === 'indirect' ? (cl.resolution === 'unresolved' ? '#ff6b6b' : '#c58af9') : cl.kind === 'tail' ? '#f5c27a' : '#4a90e2'; });
  nodes.filter(b => [...blockerPcs].some(p => b.start <= p && p < b.end)).append('rect')
    .attr('x', -5).attr('y', -5).attr('width', 8).attr('height', 8).attr('fill', '#ff3b3b');
  nodes.append('title').text(b => `${hex(b.start)}..${hex(b.end)} ${b.kind}` + (b.src ? `\n${b.src.file}:${b.src.lines}${b.src.inline ? ' (' + b.src.inline + ')' : ''}` : ''));
  side.text('Legend: yellow outline = cut point; orange = loop head; blue = join; ' +
    'circle = call (blue direct, orange tail, purple table-heuristic, red unresolved); red square = blocker site; ' +
    'orange dashed edge = back edge; purple dotted = jump-table edge; arcs = leaves (green auto, blue manual, red open).\n\n' +
    card(f) + leafText(leaves));
}

function blockText(f, b, cuts, callAt) {
  const L = [`block ${hex(b.start)}..${hex(b.end)}  ${b.n} instr  ${b.kind}${cuts.has(b.start) ? '  cut: ' + cuts.get(b.start) : ''}`,
    'succ: ' + b.succ.map(hex).join(' ')];
  if (b.src) L.push(`source: ${b.src.file}:${b.src.lines ? b.src.lines.join('-') : '?'}` + (b.src.inline ? `\ninlined: ${b.src.inline}` : ''));
  const cl = callAt.get(b.start);
  if (cl) L.push(`call ${hex(cl.site)} ${cl.kind}/${cl.resolution}: ` + cl.targets.map(t => byId.get(t).name).join(', '));
  return L.join('\n');
}

function leafText(leaves) {
  if (!leaves.length) return '\n\nleaves: none recorded (no plan for this function)';
  return '\n\nleaves:\n' + leaves.map(l => `  ${hex(l.cut)} #${l.i} ${l.state} exit ${l.exit} -> ${hex(l.target)}` +
    (l.residual ? `  residual: ${l.residual}` : '')).join('\n');
}

// ---------------------------------------------------------------- Calls
function callsView(view) {
  pickFn(view, 'function');
  if (!current) { view.append('p').style('padding', '10px').text('Pick a function.'); return; }
  const f = current;
  const callers = f.callers.map(id => byId.get(id));
  const callees = f.callees.map(id => byId.get(id));
  const kindOf = (a, b) => {  // call kinds from a to b
    const cs = a.calls.filter(c => c.targets.includes(b.id));
    return cs.map(c => c.kind + '/' + c.resolution);
  };
  const W = view.node().clientWidth - 20, rows = Math.max(callers.length, callees.length, 1);
  const RH = 22, H = Math.max(200, rows * RH + 40);
  const svg = view.append('svg').attr('width', W).attr('height', H);
  const colX = [10, W / 2 - 130, W - 290];
  const place = (list, x) => list.map((g, i) => ({g, x, y: 20 + i * RH + (H - 40 - list.length * RH) / 2}));
  const L = place(callers, colX[0]), R = place(callees, colX[2]), C = {g: f, x: colX[1], y: H / 2 - 10};
  const style = ks => ks.some(k => k.includes('unresolved')) ? ['#ff6b6b', '2 3'] :
    ks.some(k => k.includes('table-heuristic')) ? ['#c58af9', '2 3'] :
    ks.some(k => k.startsWith('tail')) ? ['#f5c27a', '6 3'] : ['#9aa4b2', null];
  const link = (a, b, ks) => { const [col, dash] = style(ks);
    svg.append('path').attr('class', 'edge').attr('stroke', col).attr('stroke-dasharray', dash)
      .attr('d', `M${a.x + 260},${a.y + 8}C${(a.x + 260 + b.x) / 2},${a.y + 8} ${(a.x + 260 + b.x) / 2},${b.y + 8} ${b.x},${b.y + 8}`)
      .append('title').text(ks.join(', ')); };
  for (const n of L) link(n, C, kindOf(n.g, f));
  for (const n of R) link(C, n, kindOf(f, n.g));
  const draw = n => {
    const gg = svg.append('g').attr('transform', `translate(${n.x},${n.y})`).style('cursor', 'pointer')
      .on('click', () => openFn(n.g, 'Calls'));
    gg.append('rect').attr('width', 260).attr('height', 17).attr('rx', 3).attr('fill', STATE_COLORS[n.g.state]);
    gg.append('text').attr('x', 4).attr('y', 12).text(n.g.name.slice(0, 40));
    gg.append('title').text(`${n.g.name}\n${n.g.id} ${n.g.state}`);
  };
  [...L, ...R, C].forEach(draw);
  d3.select('#side').text(`callers ${callers.length}, callees ${callees.length}\nedge: grey direct, orange dashed tail, purple dotted table-heuristic, red unresolved\n\n` + card(f));
}

// ---------------------------------------------------------------- Queue, Cost, Trust
function table(view, cols, rows, onclick) {
  const t = view.append('table');
  t.append('tr').selectAll('th').data(cols).join('th').text(c => c[0]);
  const tr = t.selectAll('tr.r').data(rows).join('tr').attr('class', 'r' + (onclick ? ' click' : ''));
  if (onclick) tr.on('click', (e, r) => onclick(r));
  tr.selectAll('td').data(r => cols.map(c => c[1](r))).join('td').text(v => v);
  return t;
}

function queueView(view) {
  view.append('div').attr('class', 'controls').text(`${Q.length} queue items (python3 -m zmap next)`);
  table(view, [['rank', r => r.rank], ['type', r => r.type],
    ['function', r => r.fn ? `${r.fn} ${r.name}` : ''],
    ['detail', r => r.type === 'leaf' ? `cut ${hex(r.cut)} #${r.i} exit ${r.exit} residual ${r.residual}` :
      r.type === 'cut_lemma' ? `cut ${hex(r.cut)}` :
      r.type === 'function' ? `${r.n_instr} instr, ${r.cuts_needing_assertions} cuts, ${r.loops_needing_measure} loops, contract ${r.contract_missing ? 'missing' : 'present'}` :
      `${r.key}: ${r.functions.length} functions, ${r.target_instr} target instr`]],
    Q, r => { const f = byId.get(r.fn || (r.functions || [])[0]); if (f) openFn(f); });
}

function costView(view) {
  const bk = M.ledger_totals.by_kind;
  view.append('h3').style('margin', '10px').text(`Ledger: ${M.ledger_totals.all.items} items, ${M.ledger_totals.all.minutes} min, $${M.ledger_totals.all.usd}`);
  const per = k => bk[k] && bk[k].closed ? `${(bk[k].minutes / bk[k].closed).toFixed(1)} min, $${(bk[k].usd / bk[k].closed).toFixed(2)}` : '-';
  table(view, [['per closed', r => r], ['cost', r => per(r)]], ['leaf', 'cut_lemma', 'contract']);
  table(view, [['kind', r => r[0]], ['items', r => r[1].items], ['closed', r => r[1].closed],
    ['minutes', r => r[1].minutes], ['usd', r => r[1].usd], ['requests', r => r[1].requests]], Object.entries(bk));
  const fns = M.functions.filter(f => f.ledger.all.items).sort((a, b) => b.ledger.all.minutes - a.ledger.all.minutes);
  table(view, [['function', f => `${f.id} ${f.name}`], ['state', f => f.state], ['items', f => f.ledger.all.items],
    ['minutes', f => f.ledger.all.minutes], ['usd', f => f.ledger.all.usd],
    ['leaves auto/manual/open', f => `${f.leaves.auto}/${f.leaves.manual}/${f.leaves.open}`]], fns, openFn);
}

function trustView(view) {
  view.append('div').attr('class', 'controls').text(`${M.trust.length} trusted items`);
  table(view, [['kind', r => r.kind], ['function', r => `${r.fn} ${r.name}`],
    ['contract', r => r.contract || ''], ['source', r => r.source || '']], M.trust, r => openFn(byId.get(r.fn)));
}

boot();
</script>
