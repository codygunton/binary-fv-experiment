<!doctype html>
<meta charset="utf-8">
<title>Zesu production call hierarchy — proof progress</title>
<link rel="stylesheet" href="vendor/d3-flamegraph.css">
<style>
 :root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--fg:#dfe4ec;--dim:#8a93a3;--sel:#3ddc84;--cur:#ffb454}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 #wrap{display:grid;grid-template-columns:1fr 540px;height:100vh}
 #left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
 header{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 h1{font-size:13px;margin:0;font-weight:600}
 .muted{color:var(--dim)} .pill{background:#1b2028;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11px}
 button{background:#1e242e;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 9px;font:inherit;cursor:pointer}
 button:hover{background:#252c38}
 a.button{background:#1e242e;color:var(--fg);border:1px solid var(--line);border-radius:5px;
          padding:4px 9px;text-decoration:none}
 #chart{flex:1;overflow-x:auto;overflow-y:auto;padding:6px 14px 6px 82px;min-height:0;
        cursor:grab;position:relative}
 #proof-map{flex:1;overflow:auto;padding:14px;min-height:0;display:none}
 #proof-map.active{display:block} #chart.proof-hidden{display:none}
 .proof-summary{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;margin-bottom:14px}
 .proof-stat,.author-card,.proof-block{background:#171c24;border:1px solid var(--line);border-radius:6px}
 .proof-stat{padding:10px}.proof-stat b{font-size:20px;display:block}.proof-stat small{color:var(--dim)}
 .meter{height:5px;background:#282e38;border-radius:5px;overflow:hidden;margin-top:8px}
 .meter i{display:block;height:100%;background:var(--sel)}
 .proof-tools{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
 .proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
 .author-card{padding:9px;cursor:pointer;border-left:4px solid #e5b84b}
 .author-card.blocked{border-left-color:#d95757}.author-card:hover,.proof-block:hover{background:#1d232d}
 .author-card b,.proof-block b{display:block}.author-card small{color:var(--dim)}
 .proof-block{padding:7px;cursor:pointer}.proof-block .edge{font-size:10px;color:var(--dim);margin-top:5px}
 .pc-cells{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
 .pc-cell{width:13px;height:13px;border-radius:2px;background:#3b424e;border:1px solid #687385;
          position:relative}.pc-cell.local{background:#3ddc84}.pc-cell.level4{background:#41a9ff}
 .pc-cell.root{background:#b26cff}.pc-cell.authoring{outline:1px dashed #e5b84b;outline-offset:1px}
 .trust-legend{display:flex;gap:12px;color:var(--dim);font-size:11px;flex-wrap:wrap}
 .trust-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
 #chart svg{display:block}
 #levels{position:absolute;left:10px;top:0;width:60px;z-index:2}
 .level-label{position:absolute;right:0;transform:translateY(-50%);color:#cbd4e2;
              background:#1b2028;border:1px solid #364052;border-radius:4px;padding:1px 5px;
              font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer}
 .level-label:hover{background:#252c38;border-color:#5a6a82}
 #right{display:flex;flex-direction:column;background:var(--panel);min-width:0}
 #rhead{padding:10px 14px;border-bottom:1px solid var(--line)}
 #rbody{flex:1;overflow:auto;padding:10px 14px}
 pre{margin:0;white-space:pre;font-size:12px;color:#cbd4e2}
 .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 12px;font-size:12px}
 .kv span:nth-child(odd){color:var(--dim)}
 label.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;padding:7px 11px;
           border:1px solid var(--line);border-radius:5px;background:#1b2028}
 label.chk input{accent-color:var(--sel);width:16px;height:16px}
 #chart pattern rect{stroke:none;fill-opacity:1}
 .legend{display:inline-flex;gap:10px;align-items:center;font-size:11px;color:var(--dim)}
 .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
 .legend i.conditional{background:repeating-linear-gradient(135deg,#3ddc84 0 4px,#e5b84b 4px 8px)}
 .legend i.contracted{background:repeating-linear-gradient(135deg,#e5b84b 0 4px,#d95757 4px 8px)}
 /* the frame label is a foreignObject painted over the rect and it swallows every
    click; without this nothing in the graph is clickable at all. */
 #chart foreignObject, #chart foreignObject *{pointer-events:none}
 #chart svg text{pointer-events:none}
</style>

<div id="wrap">
 <div id="left">
  <header>
    <h1>production call hierarchy</h1>
    <span class="pill" id="zoominfo">full</span>
    <button id="reset">reset zoom</button>
    <button id="proof-toggle" hidden>Level 4 proof map</button>
    <a class="button" href="README.md" target="_blank">graph rules</a>
    <span class="legend"><span><i style="background:#3ddc84"></i>unconditionally proven</span>
      <span><i class="conditional"></i>proven conditional on function contracts</span>
      <span><i style="background:#e5b84b"></i>proof in progress</span>
      <span><i class="contracted"></i>contract specified</span>
      <span><i style="background:#d95757"></i>none</span></span>
    <span class="muted"><b>scroll</b> = zoom · <b>drag</b> = pan · <b>double-click</b> = reset · click = details</span>
  </header>
  <div id="chart"><div id="levels"></div></div>
  <div id="proof-map"></div>
 </div>
 <div id="right">
  <div id="rhead"><b id="dname">—</b> <button id="copy-name" hidden>copy</button>
    <span class="muted" id="dsub"></span></div>
  <div id="rbody"><div class="muted">Click a frame to see its definition.</div></div>
 </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/d3-flamegraph.min.js"></script>
<script>
let D=null, META=null, OWNER_META=new Map(), TOTAL=0, PROGRAM_TOTAL=0, fg=null, PROGRESS=new Map();
let PROOF_MAP=null, PROOF_FILTER='all', PROOF_VIEW=false;
let copyText='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

Promise.all([fetch('flame.json').then(r=>r.json()),fetch('proof-progress.json').then(r=>r.json()),
  fetch('proof-map.json').then(r=>r.ok?r.json():null)]).then(([d,p,proofMap])=>{
  D=d.tree; META=d.meta; TOTAL=d.total; PROGRAM_TOTAL=d.programTotal;
  PROOF_MAP=proofMap;
  Object.values(META).forEach(m=>{if(m.owner) OWNER_META.set(m.owner,m)});
  (p.states||[]).forEach(state=>PROGRESS.set(state.qualified,state));
  build();
  if(PROOF_MAP) $('#proof-toggle').hidden=false;
});

// stable key: the path of frame names, matching what the generator emitted
function keyOf(node){
  const parts=[]; let n=node;
  while(n){ parts.unshift(n.data.name); n=n.parent; }
  return parts.join('|');
}

let Z=1, baseW=0;
const proofState=d=>PROGRESS.get(META[keyOf(d)]?.qualified)||{status:'none'};
const proofColor=s=>({unconditionally_proven:'#3ddc84',
  conditionally_proven:'url(#conditionally-proven)',in_progress:'#e5b84b',
  contracted:'url(#contract-specified)',none:'#d95757'})[s]||'#d95757';

function build(){
  baseW = $('#chart').clientWidth - 100;
  fg = flamegraph()
    .width(baseW)
    .cellHeight(19)
    .transitionDuration(0)             // no animation: zoom must track the wheel
    .minFrameSize(0)
    .sort(false)                       // keep address order from the generator
    .inverted(false)
    .selfValue(false)
    .setColorMapper(d=>proofColor(proofState(d).status));
  d3.select('#chart').datum(D).call(fg);
  const defs=d3.select('#chart svg').insert('defs',':first-child');
  const pattern=defs.append('pattern').attr('id','conditionally-proven')
    .attr('patternUnits','userSpaceOnUse').attr('width',8).attr('height',8)
    .attr('patternTransform','rotate(45)');
  pattern.append('rect').attr('width',8).attr('height',8).attr('fill','#e5b84b');
  pattern.append('rect').attr('width',4).attr('height',8).attr('fill','#3ddc84');
  const contracted=defs.append('pattern').attr('id','contract-specified')
    .attr('patternUnits','userSpaceOnUse').attr('width',8).attr('height',8)
    .attr('patternTransform','rotate(45)');
  contracted.append('rect').attr('width',8).attr('height',8).attr('fill','#d95757');
  contracted.append('rect').attr('width',4).attr('height',8).attr('fill','#e5b84b');
  wireMouse();
  renderLevelLabels();
}

function renderLevelLabels(){
  const chart=$('#chart'), rail=$('#levels'), chartBox=chart.getBoundingClientRect();
  const rows=new Map(), names=new Map();
  d3.selectAll('#chart g.frame').each(function(d){
    if(!d || d.depth<2) return;
    if(!rows.has(d.depth)){
      const rect=this.querySelector('rect'); if(!rect) return;
      const box=rect.getBoundingClientRect();
      rows.set(d.depth, box.top-chartBox.top+chart.scrollTop+box.height/2);
    }
    const qualified=META[keyOf(d)]?.qualified;
    if(qualified){
      if(!names.has(d.depth)) names.set(d.depth, []);
      if(!names.get(d.depth).includes(qualified)) names.get(d.depth).push(qualified);
    }
  });
  rail.innerHTML='';
  [...rows].sort((a,b)=>a[0]-b[0]).forEach(([depth,top])=>{
    const label=document.createElement('span');
    label.className='level-label'; label.textContent=`Level ${depth-1}`; label.style.top=`${top}px`;
    label.onclick=ev=>{ ev.stopPropagation(); showLevel(depth-1, names.get(depth)||[]); };
    rail.appendChild(label);
  });
}

function setCopy(value){
  copyText=value;
  const button=$('#copy-name'); button.hidden=!value; button.textContent='copy';
}

async function copyCurrent(){
  if(!copyText) return;
  try{ await navigator.clipboard.writeText(copyText); }
  catch(_){
    const area=document.createElement('textarea'); area.value=copyText; document.body.appendChild(area);
    area.select(); document.execCommand('copy'); area.remove();
  }
  const button=$('#copy-name'); button.textContent='copied';
  setTimeout(()=>button.textContent='copy',900);
}

function showLevel(level,names){
  $('#dname').textContent=`Level ${level}`;
  $('#dsub').textContent=`${names.length} functions`;
  setCopy(names.join(' | '));
  $('#rbody').innerHTML=names.length
    ? `<pre>${names.map(esc).join('\n')}</pre>`
    : '<div class="muted">No named functions at this level.</div>';
}

function setZoom(z, anchorClientX){
  const el=$('#chart');
  const prevW = baseW*Z;
  const ax = (anchorClientX!==undefined)
      ? anchorClientX - el.getBoundingClientRect().left : el.clientWidth/2;
  const frac = (el.scrollLeft + ax) / prevW;        // point under cursor, in [0,1]
  Z = Math.min(400, Math.max(1, z));
  const w = baseW*Z;
  fg.width(w); fg.update(); renderLevelLabels();
  el.scrollLeft = frac*w - ax;                      // keep that point under the cursor
  $('#zoominfo').textContent = Z<=1.001 ? 'full'
      : `${Z.toFixed(1)}× · ${Math.round(TOTAL/Z)} instrs visible`;
}

function wireMouse(){
  const el=$('#chart');

  // wheel = zoom about the cursor
  el.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const f = Math.exp(-ev.deltaY * 0.0022);
    setZoom(Z*f, ev.clientX);
  }, {passive:false});

  // drag = pan; a drag must not be mistaken for a click
  let down=null, moved=0;
  el.addEventListener('mousedown', ev=>{ if(ev.button!==0) return;
    down={x:ev.clientX, sl:el.scrollLeft}; moved=0; });
  window.addEventListener('mousemove', ev=>{ if(!down) return;
    const dx=ev.clientX-down.x; moved=Math.max(moved,Math.abs(dx));
    el.scrollLeft = down.sl - dx; el.style.cursor='grabbing'; });
  window.addEventListener('mouseup', ()=>{ down=null; el.style.cursor=''; });

  // double click = reset
  el.addEventListener('dblclick', ev=>{ ev.preventDefault(); setZoom(1); });

  // click handling is ours entirely: capture and stop, so the library never zooms
  el.addEventListener('click', ev=>{
    if(ev.target.closest('#levels')) return;
    ev.stopPropagation();
    if(moved>4) return;                            // that was a pan, not a click
    const g=ev.target.closest('g'); if(!g) return;
    const d=d3.select(g).datum(); if(!d||!d.data) return;
    details(d);
  }, true);
}

function details(d){
  const k=keyOf(d), m=META[k]||{}, progress=proofState(d);
  const qualified=m.qualified||d.data.name;
  $('#dname').textContent=qualified;
  setCopy(qualified);
  $('#dsub').textContent=`${d.data.value} instructions · ${(d.data.value/PROGRAM_TOTAL*100).toFixed(2)}% of program execution`;
  const calls=(m.callees||[]).map(call=>`${esc(call.kind)} → ${esc(OWNER_META.get(call.callee)?.qualified||call.callee)}`);
  const tails=(m.tailDependencies||[]).map(t=>`${esc(t.qualified)}: 0x${t.transfer.source.toString(16)} → 0x${t.transfer.target.toString(16)}, completes at ${t.completionSourcePcs.map(x=>'0x'+x.toString(16)).join(', ')}`);
  const handoffs=(m.fragmentHandoffs||[]).map(e=>`0x${e.sourcePc.toString(16)} → 0x${e.targetPc.toString(16)}`);
  const reentries=(m.parentReentryEdges||[]).map(e=>`0x${e.sourcePc.toString(16)} → 0x${e.targetPc.toString(16)}`);
  const carrierRoutes=(m.carrierRoutes||[]).map(route=>{
    const h=route.handoff||{}, pcs=(route.carrierPcs||[]).map(x=>'0x'+x.toString(16)).join(', ')||'none';
    const paths=(route.carrierPaths||[]).map(p=>p.pcs.map(x=>'0x'+x.toString(16)).join(' → ')).join('<br>')||'none';
    return `${esc(route.classification||'unclassified')}: 0x${Number(h.sourcePc).toString(16)} → 0x${Number(h.targetPc).toString(16)}; carriers ${pcs}; paths ${paths}; registers/stack/status/allocation/HeapArrayRep ${route.classification==='sourceReviewedOutcomePath'?'unmeasured':'not claimed'}`;
  });
  const frameTree=(frames, depth=0)=>frames.flatMap(frame=>{
    const target=frame.targetIdentity?.qualified||'?';
    const source=frame.sourcePc==null?'source-derived sites':`0x${frame.sourcePc.toString(16)}`;
    const ras=(frame.returnSites||[]).map(site=>`0x${site.sourcePc.toString(16)}→0x${site.returnPc.toString(16)}`).join(', ');
    const cycle=frame.cycleBackEdge?`; back-edge to ${frame.cycleBackEdge.ancestorIdentity?.qualified||'?'} (${(frame.cycleBackEdge.transitions||[]).length} transition${(frame.cycleBackEdge.transitions||[]).length===1?'':'s'})`:'';
    const line=`${'· '.repeat(depth)}${frame.kind} ${source} → ${target} @ 0x${frame.targetPc.toString(16)} (${(frame.activeCalleeExecutionPcs||[]).length} PCs${ras?`; RA ${ras}`:''}${cycle})`;
    return [line,...frameTree(frame.activeCalleeFrames||[],depth+1)];
  });
  const activeFrames=frameTree(m.activeCalleeFrames||[]);
  const callers=(m.callers||[]).map(call=>`${esc(call.kind)} ← ${esc(call.caller==='program'?'program':OWNER_META.get(call.caller)?.qualified||call.caller)}`);
  $('#rbody').innerHTML=
   `<div class="kv">
      <span>stack path</span><span>${esc(k.replace(/\|/g,' › '))}</span>
      <span>instance kind</span><span>${esc(m.kind||'?')}</span>
      <span>proof status</span><span>${esc(progress.status.replaceAll('_',' '))}</span>
      <span>contract/theorem</span><span>${esc(progress.theorem||progress.contract||'none')}</span>
      <span>outstanding condition</span><span>${esc(progress.condition||'none')}</span>
      <span>actual callers</span><span>${callers.join('<br>')||'none'}</span>
      <span>actual calls</span><span>${calls.join('<br>')||'none'}</span>
      <span>resolved tail route</span><span>${tails.join('<br>')||'none'}</span>
      <span>attribution subtree handoffs</span><span>${handoffs.join(', ')||'none'}</span>
      <span>parent subtree reentries</span><span>${reentries.join(', ')||'none'}</span>
      <span>carrier routes</span><span>${carrierRoutes.join('<br>')||'none'}</span>
      <span>active callee tree</span><span>${activeFrames.map(esc).join('<br>')||'none'}</span>
      <span>source</span><span>${esc(m.file||'?')}:${m.line??'?'}</span>
      <span>instructions</span><span>${d.data.value}</span>
      <span>fragments</span><span>${m.frags>1?`<b style="color:var(--cur)">${m.frags}</b> (non-contiguous)`:'1 (contiguous)'}</span>
      <span>children</span><span>${(d.children||d._children||[]).length}</span>
      <span>entries</span><span>${(m.entries||[]).map(x=>'0x'+x.toString(16)).join(', ')||'none'}</span>
      <span>exits</span><span>${(m.exits||[]).length}</span>
      <span>loop SCCs</span><span>${(m.loopSccs||[]).join(', ')||'none'}</span>
    </div>
    <pre>${m.src?esc(m.src.text):'&lt;source unavailable&gt;'}</pre>`;
}

function proofConnection(pc){
  const ids=pc.formalManifests||[];
  if(!ids.length) return 'none';
  const rows=ids.map(id=>PROOF_MAP.manifests.find(row=>row.id===id)).filter(Boolean);
  if(rows.some(row=>row.connection==='root')) return 'root';
  if(rows.some(row=>row.connection==='level4')) return 'level4';
  return 'local';
}

function proofAuthoringPcs(){
  const result=new Set();
  PROOF_MAP.authoringRegions.forEach(region=>(region.pcs||[]).forEach(pc=>result.add(pc)));
  return result;
}

function renderProofMap(){
  const coverage=PROOF_MAP.formalCoverage,total=PROOF_MAP.instructions.length;
  const authoringPcs=proofAuthoringPcs();
  const visibleRegions=PROOF_MAP.authoringRegions.filter(region=>
    PROOF_FILTER==='all'||region.authoringState===PROOF_FILTER);
  const stat=(label,value,color)=>`<div class="proof-stat"><small>${esc(label)}</small><b>${value}/${total}</b>
    <div class="meter"><i style="width:${value/total*100}%;background:${color}"></i></div></div>`;
  const regions=visibleRegions.map(region=>`<div class="author-card ${esc(region.authoringState)}"
      data-region="${esc(region.id)}"><b>${esc(region.label)}</b>
      <small>${esc(region.authoringState)} · ${(region.pcs||[]).length||region.boundaryInstructionCount||0} instructions</small>
      <div>${esc(region.blocker)}</div></div>`).join('');
  const instructionByPc=new Map(PROOF_MAP.instructions.map(row=>[row.pc,row]));
  const blocks=PROOF_MAP.blocks.map(block=>{
    const cells=block.pcs.map(pc=>{const row=instructionByPc.get(pc),connection=proofConnection(row);
      return `<i class="pc-cell ${connection} ${authoringPcs.has(pc)?'authoring':''}" title="0x${pc.toString(16)} ${esc(row.mnemonic)}"></i>`;}).join('');
    return `<div class="proof-block" data-pc="${block.entryPc}"><b>0x${block.entryPc.toString(16)}</b>
      <span>${block.pcs.length} instruction${block.pcs.length===1?'':'s'}</span><div class="pc-cells">${cells}</div>
      <div class="edge">→ ${block.successors.map(pc=>'0x'+pc.toString(16)).join(', ')||'terminal'}</div></div>`;
  }).join('');
  $('#proof-map').innerHTML=`<div class="proof-summary">
      ${stat('kernel-linked local PCs',coverage.localPcCount,'#3ddc84')}
      ${stat('connected into Level 4',coverage.level4PcCount,'#41a9ff')}
      ${stat('reachable from root_compliance',coverage.rootPcCount,'#b26cff')}</div>
    <div class="trust-legend"><span><i style="background:#3ddc84"></i>formal local</span>
      <span><i style="background:#3b424e;border:1px solid #687385"></i>production ELF only</span>
      <span><i style="background:#e5b84b"></i>authoring suggestion</span>
      <span>LLVM IR: ${esc(PROOF_MAP.compilerProvenance.state)}</span></div>
    <div class="proof-tools"><b>authoring regions</b>
      ${['all','ready','blocked'].map(value=>`<button data-filter="${value}" ${PROOF_FILTER===value?'disabled':''}>${value}</button>`).join('')}</div>
    <div class="proof-grid">${regions}</div><div class="proof-tools"><b>parent-owned CFG blocks</b>
      <span class="muted">click a block for instructions, successors, effects, and manifests</span></div>
    <div class="proof-grid">${blocks}</div>`;
  $('#proof-map').querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{
    PROOF_FILTER=button.dataset.filter; renderProofMap();
  });
  $('#proof-map').querySelectorAll('[data-region]').forEach(card=>card.onclick=()=>showAuthoringRegion(card.dataset.region));
  $('#proof-map').querySelectorAll('[data-pc]').forEach(block=>block.onclick=()=>showProofBlock(Number(block.dataset.pc)));
}

function showAuthoringRegion(id){
  const region=PROOF_MAP.authoringRegions.find(row=>row.id===id); if(!region)return;
  $('#dname').textContent=region.label; $('#dsub').textContent=region.authoringState; setCopy(region.id);
  const matches=(region.templateMatches||[]).map(match=>
    `${esc(match.name)} · score ${esc(match.score.join('/'))}<br><span class="muted">${esc(match.module)}</span>`).join('<br>')||'none';
  const prep=region.preparation||{};
  $('#rbody').innerHTML=`<div class="kv"><span>trust track</span><span>authoring suggestion — not proof</span>
    <span>state</span><span>${esc(region.authoringState)}</span><span>blocker</span><span>${esc(region.blocker)}</span>
    <span>boundary IDs</span><span>${esc((region.boundaryIds||[]).join(', ')||'parent-owned')}</span>
    <span>empirical evidence</span><span>${esc(region.evidence||'not attached')}</span>
    <span>live registers</span><span>${esc((prep.liveRegisters||[]).join(', ')||'none')}</span>
    <span>protected memory</span><span>${esc((prep.protectedMemory||[]).join('; ')||'none')}</span>
    <span>prerequisites</span><span>${esc((prep.prerequisites||[]).join('; ')||'none')}</span>
    <span>source identity</span><span>${esc(prep.sourceIdentity||'unknown')}</span>
    <span>template matches</span><span>${matches}</span></div>`;
  if(region.starterProof) $('#rbody').insertAdjacentHTML('beforeend',
    `<h3>Lean starter (${esc(region.starterProof.trust)})</h3><pre>${esc(region.starterProof.text)}</pre>`);
}

function showProofBlock(entryPc){
  const block=PROOF_MAP.blocks.find(row=>row.entryPc===entryPc); if(!block)return;
  const rows=block.pcs.map(pc=>PROOF_MAP.instructions.find(row=>row.pc===pc));
  $('#dname').textContent=`block 0x${entryPc.toString(16)}`; $('#dsub').textContent=`${rows.length} parent-owned instructions`;
  setCopy(block.pcs.map(pc=>'0x'+pc.toString(16)).join(' '));
  $('#rbody').innerHTML=`<div class="kv"><span>successors</span><span>${block.successors.map(pc=>'0x'+pc.toString(16)).join(', ')||'terminal'}</span>
    <span>formal manifests</span><span>${esc([...new Set(rows.flatMap(row=>row.formalManifests))].join(', ')||'none')}</span>
    <span>artifact</span><span>validated against production ELF</span></div><pre>${rows.map(row=>
      `0x${row.pc.toString(16)}  ${row.mnemonic.padEnd(7)} ${row.operands}\n  read ${row.reads.join(',')||'-'} · write ${row.writes.join(',')||'-'} · memory ${row.memory.length?'yes':'no'}`).join('\n')}</pre>`;
}

function toggleProofMap(){
  if(!PROOF_MAP)return; PROOF_VIEW=!PROOF_VIEW;
  $('#chart').classList.toggle('proof-hidden',PROOF_VIEW); $('#proof-map').classList.toggle('active',PROOF_VIEW);
  $('#proof-toggle').textContent=PROOF_VIEW?'call hierarchy':'Level 4 proof map';
  $('#reset').hidden=PROOF_VIEW; if(PROOF_VIEW)renderProofMap();
}

$('#reset').onclick=()=>setZoom(1);
$('#proof-toggle').onclick=toggleProofMap;
$('#copy-name').onclick=copyCurrent;
window.addEventListener('resize',()=>{ if(fg){ baseW=$('#chart').clientWidth-100; setZoom(Z); } });
</script>
